# Pulumi ESC Environment: korda/base
# Keyless GCP OIDC authentication + Secret Manager bridge for Coolify/SurrealDB.
values:
  gcp:
    login:
      fn::open::gcp-login:
        project: ${gcp.projectId}
        oidc:
          workloadPoolId: ${gcp.workloadPoolId}
          providerId: ${gcp.oidcProviderId}
          serviceAccount: ${gcp.deployerServiceAccount}
  environmentVariables:
    GOOGLE_OAUTH_ACCESS_TOKEN: ${gcp.login.accessToken}
    CLOUDSDK_AUTH_ACCESS_TOKEN: ${gcp.login.accessToken}
  pulumiConfig:
    gcp:project: ${gcp.projectId}
    gcp:region: asia-southeast1
    korda-infra:web_min_instances: "0"
    korda-infra:web_max_instances: "5"
    korda-infra:worker_min_instances: "0"
    korda-infra:worker_max_instances: "5"
  # Required per-stack overrides (in korda/dev, korda/prod):
  # gcp.projectId, gcp.workloadPoolId, gcp.oidcProviderId, gcp.deployerServiceAccount
