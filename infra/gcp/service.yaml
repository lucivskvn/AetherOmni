---
apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: aether-web
  namespace: "${GCP_PROJECT_ID}"
  labels:
    cloud.googleapis.com/location: "${GCP_REGION}"
  annotations:
    run.googleapis.com/ingress: all
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/launch-stage: BETA
    spec:
      serviceAccountName: "${SERVICE_ACCOUNT}"
      timeoutSeconds: 900
      containers:
      - image: "${GCP_REGION}-docker.pkg.dev/${GCP_PROJECT_ID}/cloud-run-source-deploy/aether-web:latest"
        name: web
        securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
        ports:
        - containerPort: 8080
        env:
        - name: RELEASE_VERSION
          value: "${RELEASE_VERSION}"
        - name: DJANGO_DEBUG
          value: "False"
        - name: SECURE_SSL_REDIRECT
          value: "True"
        - name: SESSION_COOKIE_SECURE
          value: "True"
        - name: CSRF_COOKIE_SECURE
          value: "True"
        - name: GS_BUCKET_NAME
          value: "${GS_BUCKET_NAME}"
        - name: DJANGO_ALLOWED_HOSTS
          value: "localhost,127.0.0.1,.run.app"
        - name: DJANGO_CSRF_TRUSTED_ORIGINS
          value: "https://*.run.app"
        - name: GCP_PROJECT_ID
          value: "${GCP_PROJECT_ID}"
        - name: GCP_REGION
          value: "${GCP_REGION}"
        - name: GCP_QUEUE_LOCATION
          value: "${GCP_REGION}"
        - name: GCP_QUEUE_NAME
          value: "extractor-tasks"
        - name: APP_URL
          value: "${APP_URL}"
        - name: WORKER_URL
          value: "${WORKER_URL}"
        - name: SURREAL_NS
          value: "aetheromni"
        - name: SURREAL_DB
          value: "extractor"
        - name: SURREALDB_OFFLINE
          value: "False"
        - name: GOOGLE_CLOUD_PROJECT
          value: "${GCP_PROJECT_ID}"
        - name: GEMINI_MODEL
          value: "gemini-3.6-flash"
        - name: GEMINI_MODEL_BATCH
          value: "gemini-3.5-flash-lite"
        - name: SURREAL_URL
          valueFrom:
            secretKeyRef:
              name: SURREAL_URL
              key: "latest"
        - name: ADMIN_EMAIL
          valueFrom:
            secretKeyRef:
              name: ADMIN_EMAIL
              key: "latest"
        - name: DJANGO_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: DJANGO_SECRET_KEY
              key: "latest"
        - name: GEMINI_API_KEY
          valueFrom:
            secretKeyRef:
              name: GEMINI_API_KEY
              key: "latest"
        - name: SURREAL_USER
          valueFrom:
            secretKeyRef:
              name: SURREAL_USER
              key: "latest"
        - name: SURREAL_PASS
          valueFrom:
            secretKeyRef:
              name: SURREAL_PASS
              key: "latest"
        - name: SUPABASE_URL
          valueFrom:
            secretKeyRef:
              name: SUPABASE_URL
              key: "latest"
        - name: SUPABASE_PUBLIC_KEY
          valueFrom:
            secretKeyRef:
              name: SUPABASE_PUBLIC_KEY
              key: "latest"
        - name: CF_TURNSTILE_SITE_KEY
          valueFrom:
            secretKeyRef:
              name: CF_TURNSTILE_SITE_KEY
              key: "latest"
        resources:
          limits:
            cpu: 1000m
            memory: 1024Mi
  traffic:
  - latestRevision: true
    percent: 100
