---
# ==============================================================================
# GCP PRODUCTION BEST PRACTICES CLOUD BUILD PIPELINE (DYNAMIC REGION + VERSION)
# ==============================================================================
# Compliance & Standards:
# - OWASP Container Hardening (Non-Root Execution, Minimal Alpine Base)
# - GCP Cloud Run Production Guidelines (Scale-to-Zero, Health Probes, HTTP/2)
# - GCP Always-Free Tier Safety Limits
#
# Substitution Variables (configure in Cloud Build trigger):
#   _REGION          - GCP region (default: asia-southeast1)
#
# Built-in Cloud Build substitutions used:
#   $PROJECT_ID      - Auto-populated by Cloud Build
#   $PROJECT_NUMBER  - Auto-populated by Cloud Build
#   $SHORT_SHA       - Git short commit SHA (auto-populated by Cloud Build trigger)
#
# RELEASE_VERSION scheme (matches update_docs.py and sonar-project.properties):
#   vMAJOR.MINOR.PATCH
#   MAJOR.MINOR is read from the VERSION file in the repo root.
#   PATCH is derived from the latest release tag and kept stable for Docker/Cloud Run tag safety.
#   We intentionally avoid appending +SHORT_SHA to the image tag because Docker and
#   Cloud Run reject '+' in image tags. The short SHA remains available in the app
#   metadata when needed, but the deployable image tag is the stable semver.
#
# Shell variables inside bash args use $$ to avoid Cloud Build substitution
# conflicts. Cloud Build substitution vars (${_REGION}, ${PROJECT_ID}, etc.)
# use single $ as normal.
# ==============================================================================
substitutions:
  _REGION: asia-southeast1
  _GITHUB_REPOSITORY: lucivskvn/AetherOmni
  # Optional public application URL. Defaults to the canonical domain.
  _APP_URL: "https://korda.fainko.my.id"
  # Manual/rollback builds must identify a commit whose mainline SonarQube gate passed.
  _DEPLOY_COMMIT_SHA: ""
  # Leave empty for the canonical commit-derived version. A rollback trigger may
  # supply an explicit MAJOR.MINOR.PATCH version.
  _RELEASE_VERSION: ""

steps:
  # 0. Compute dynamic RELEASE_VERSION from VERSION file + git commit count + SHA
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:11901dc1a8e6da464f2a7259d503166ab7c55092dbc41373b65c7c676ff6f8f4'
    id: 'compute-version'
    entrypoint: bash
    args:
      - '-euc'
      - |
        # Compute MAJOR.MINOR from VERSION file
        MAJOR_MINOR=$$(cat VERSION | tr -d '[:space:]' | cut -d. -f1-2)

        release_override='${_RELEASE_VERSION}'
        if [ -n "$${release_override}" ]; then
          RELEASE_VERSION="$${release_override#v}"
          printf '%s' "$${RELEASE_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$$'
        else
          if [ ! -d .git ]; then
            echo "_RELEASE_VERSION is required when the submitted source has no Git metadata" >&2
            exit 1
          fi
          if [ "$$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow --no-tags origin
          fi
          PATCH=$$(git rev-list --count HEAD)
          RELEASE_VERSION="$${MAJOR_MINOR}.$${PATCH}"
        fi
        BUILD_SHA="${SHORT_SHA:-}"
        if [ -z "$${BUILD_SHA}" ]; then
          BUILD_SHA=$$(git rev-parse --short HEAD 2>/dev/null || echo "local")
        fi
        IMAGE_TAG="$${RELEASE_VERSION}"
        echo "RELEASE_VERSION=$${RELEASE_VERSION}" > /workspace/release_version.env
        echo "IMAGE_TAG=$${IMAGE_TAG}" >> /workspace/release_version.env
        echo "BUILD_SHA=$${BUILD_SHA}" >> /workspace/release_version.env
        echo "Computed RELEASE_VERSION=$${RELEASE_VERSION}"
        echo "Computed IMAGE_TAG=$${IMAGE_TAG}"

  # 1. Kaniko Container Build with Layer Caching
  # The build must push the exact version tag selected by compute-version so the
  # later deploy steps can reference an image that actually exists in Artifact Registry.
  # The standard executor image is shell-less. This step must source the
  # computed release metadata, so use Kaniko's official BusyBox-enabled image.
  - name: 'gcr.io/kaniko-project/executor@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd'
    id: 'build-image'
    waitFor: ['compute-version']
    entrypoint: /busybox/sh
    args:
      - '-euc'
      - |
        if [ -f /workspace/release_version.env ]; then
          . /workspace/release_version.env
        else
          echo "Missing computed release version metadata" >&2
          exit 1
        fi
        IMAGE_TAG="$${IMAGE_TAG:-$${RELEASE_VERSION}}"
        /kaniko/executor \
          --context=dir:///workspace \
          --dockerfile=/workspace/Dockerfile \
          --destination=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/korda:$SHORT_SHA \
          --destination=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/korda:$${IMAGE_TAG} \
          --destination=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/korda:latest \
          --cache=true \
          --cache-repo=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/korda-cache \
          --cache-ttl=24h \
          --image-download-retry=3 \
          --image-fs-extract-retry=3 \
          --push-retry=3 \
          --reproducible \
          --cleanup

  # 2. Do not deploy until GitHub Actions reports a successful mainline SonarQube gate
  # for this exact commit. Container construction may run in parallel with analysis,
  # but production mutation remains blocked on the authoritative quality result.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:11901dc1a8e6da464f2a7259d503166ab7c55092dbc41373b65c7c676ff6f8f4'
    id: 'wait-for-quality-gate'
    waitFor: ['build-image']
    entrypoint: bash
    args:
      - '-euc'
      - |
        TARGET_SHA='${_DEPLOY_COMMIT_SHA}'
        if [ -z "$${TARGET_SHA}" ]; then
          TARGET_SHA='${COMMIT_SHA}'
        fi
        printf '%s' '${_GITHUB_REPOSITORY}' | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$$'
        printf '%s' "$${TARGET_SHA}" | grep -Eq '^[0-9a-fA-F]{40}$$'
        python3 - '${_GITHUB_REPOSITORY}' "$${TARGET_SHA}" <<'PY'
        import json
        import sys
        import time
        import urllib.error
        import urllib.request

        repository, commit_sha = sys.argv[1:]
        endpoint = f"https://api.github.com/repos/{repository}/commits/{commit_sha}/check-runs"
        request = urllib.request.Request(
            endpoint,
            headers={
                "Accept": "application/vnd.github+json",
                "User-Agent": "AetherOmni-CloudBuild-Gate",
            },
        )
        sonar_names = {
            "3. SonarCloud Quality Gate",
            "2. SonarCloud Quality Gate",
            "SonarCloud Code Analysis",
            "SonarCloud Quality Gate",
            "2. SonarQube Community Mainline Gate",
        }
        semgrep_names = {
            "4. Semgrep Cloud SAST",
            "semgrep-cloud-platform",
            "semgrep",
        }
        codeql_names = {
            "CodeQL",
            "Analyze (python)",
            "Analyze (javascript-typescript)",
            "Analyze (actions)",
        }

        for attempt in range(30):
            try:
                with urllib.request.urlopen(request, timeout=15) as response:
                    payload = json.load(response)
            except (urllib.error.URLError, TimeoutError, json.JSONDecodeError) as exc:
                print(f"GitHub quality-gate query attempt {attempt + 1} failed: {type(exc).__name__}")
            else:
                check_runs = payload.get("check_runs", [])
                sonar_runs = [item for item in check_runs if item.get("name") in sonar_names]
                semgrep_runs = [item for item in check_runs if item.get("name") in semgrep_names]
                codeql_runs = [item for item in check_runs if item.get("name") in codeql_names]

                all_tracked = sonar_runs + semgrep_runs + codeql_runs
                completed = [item for item in all_tracked if item.get("status") == "completed"]
                failed = [item for item in completed if item.get("conclusion") not in ("success", "neutral")]
                if failed:
                    print(f"Deployment blocked: Gate check '{failed[0].get('name')}' concluded '{failed[0].get('conclusion')}'.")
                    raise SystemExit(1)

                sonar_passed = any(item.get("status") == "completed" and item.get("conclusion") in ("success", "neutral") for item in sonar_runs)
                # Semgrep GitHub App executes on pull requests; on direct main pushes, if semgrep_runs is empty, SonarCloud + CodeQL provide the SAST gate.
                semgrep_passed = (
                    any(item.get("status") == "completed" and item.get("conclusion") in ("success", "neutral") for item in semgrep_runs)
                    if semgrep_runs
                    else True
                )
                codeql_passed = (
                    any(item.get("status") == "completed" and item.get("conclusion") in ("success", "neutral") for item in codeql_runs)
                    if codeql_runs
                    else False
                )

                if sonar_passed and semgrep_passed and codeql_passed:
                    print("GitHub quality gate passed across SonarCloud, CodeQL, and SAST checks.")
                    raise SystemExit(0)

                print(
                    f"Waiting for GitHub quality gate: SonarCloud passed={sonar_passed}, "
                    f"Semgrep passed={semgrep_passed}, CodeQL passed={codeql_passed} (attempt {attempt + 1}/30)"
                )
            time.sleep(30)

        print("Timed out waiting for mandatory SonarCloud, CodeQL, and Semgrep quality gates to pass", file=sys.stderr)
        raise SystemExit(1)
        PY

  # 3. Validate Production Prerequisites & Secrets
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:11901dc1a8e6da464f2a7259d503166ab7c55092dbc41373b65c7c676ff6f8f4'
    id: 'validate-prerequisites'
    waitFor: ['wait-for-quality-gate']
    entrypoint: bash
    args:
      - '-euc'
      - |
        echo "Validating Secret Manager prerequisites..."
        required_secrets="DJANGO_SECRET_KEY GEMINI_API_KEY SURREAL_URL SURREAL_USER"
        required_secrets="$${required_secrets} SURREAL_PASS ADMIN_EMAIL SUPABASE_URL"
        required_secrets="$${required_secrets} SUPABASE_PUBLIC_KEY SUPABASE_SERVICE_ROLE_KEY CF_TURNSTILE_SITE_KEY"
        for secret in $${required_secrets}; do
          if ! gcloud secrets describe "$${secret}" --project="${PROJECT_ID}" >/dev/null 2>&1; then
            echo "ERROR: Required secret '$${secret}' is missing in project '${PROJECT_ID}'." >&2
            echo "Please create '$${secret}' in GCP Secret Manager before triggering deployment." >&2
            exit 1
          fi
        done
        echo "All required secrets verified in GCP Secret Manager."

  # 4. Production GCP Cloud Run Worker Service Deployment
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:11901dc1a8e6da464f2a7259d503166ab7c55092dbc41373b65c7c676ff6f8f4'
    id: 'deploy-worker'
    waitFor: ['validate-prerequisites']
    entrypoint: bash
    args:
      - '-euc'
      - |
        if [ -f /workspace/release_version.env ]; then
          . /workspace/release_version.env
        else
          echo "Missing computed release version metadata" >&2
          exit 1
        fi
        IMAGE_TAG="${IMAGE_TAG:-$${RELEASE_VERSION}}"
        IMAGE_TAG="$${IMAGE_TAG//+/-}"
        WEB_URL="$$(gcloud run services describe korda-web --region=${_REGION} --format='value(status.url)' 2>/dev/null || echo '')"
        WORKER_URL="$$(gcloud run services describe korda-worker --region=${_REGION} --format='value(status.url)' 2>/dev/null || echo '')"
        APP_URL='${_APP_URL}'
        APP_URL="$${APP_URL:-$${WEB_URL}}"
        ENV_VARS="RELEASE_VERSION=$${RELEASE_VERSION},DJANGO_DEBUG=False,ENABLE_PERIODIC_MAINTENANCE=False,GUNICORN_WORKERS=1"
        ENV_VARS="$${ENV_VARS},GS_BUCKET_NAME=${PROJECT_ID}-media-data-extractor"
        ENV_VARS="$${ENV_VARS},GCP_PROJECT_ID=${PROJECT_ID},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GCP_REGION=${_REGION}"
        ENV_VARS="$${ENV_VARS},GCP_QUEUE_LOCATION=${_REGION},GCP_QUEUE_NAME=extractor-tasks"
        ENV_VARS="$${ENV_VARS},APP_URL=$${APP_URL},WORKER_URL=$${WORKER_URL}"
        ENV_VARS="$${ENV_VARS},SURREAL_NS=korda,SURREAL_DB=extractor,SURREALDB_OFFLINE=False"
        ENV_VARS="$${ENV_VARS},GEMINI_MODEL=gemini-2.5-flash,GEMINI_MODEL_BATCH=gemini-2.5-flash-lite"
        ENV_VARS="$${ENV_VARS},CLOUD_TASKS_SERVICE_ACCOUNT=${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
        SECRETS="DJANGO_SECRET_KEY=DJANGO_SECRET_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest"
        SECRETS="$${SECRETS},SURREAL_URL=SURREAL_URL:latest,SURREAL_USER=SURREAL_USER:latest"
        SECRETS="$${SECRETS},SURREAL_PASS=SURREAL_PASS:latest,ADMIN_EMAIL=ADMIN_EMAIL:latest"
        SECRETS="$${SECRETS},SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_PUBLIC_KEY=SUPABASE_PUBLIC_KEY:latest"
        SECRETS="$${SECRETS},SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest"
        SECRETS="$${SECRETS},CF_TURNSTILE_SITE_KEY=CF_TURNSTILE_SITE_KEY:latest"
        if gcloud secrets describe SUPABASE_DATABASE_URL --project="${PROJECT_ID}" >/dev/null 2>&1; then
          SECRETS="$${SECRETS},DATABASE_URL=SUPABASE_DATABASE_URL:latest"
        fi
        if gcloud secrets describe SENTRY_DSN --project="${PROJECT_ID}" >/dev/null 2>&1; then
          SECRETS="$${SECRETS},SENTRY_DSN=SENTRY_DSN:latest"
        fi
        gcloud run deploy korda-worker \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/korda:$${IMAGE_TAG} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --min-instances=0 \
          --max-instances=5 \
          --service-account=${PROJECT_NUMBER}-compute@developer.gserviceaccount.com \
          --set-env-vars="$${ENV_VARS}" \
          --set-secrets="$${SECRETS}"

  # 5. Production GCP Cloud Run Web Service Deployment
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:11901dc1a8e6da464f2a7259d503166ab7c55092dbc41373b65c7c676ff6f8f4'
    id: 'deploy-web'
    waitFor: ['deploy-worker']
    entrypoint: bash
    args:
      - '-euc'
      - |
        if [ -f /workspace/release_version.env ]; then
          . /workspace/release_version.env
        else
          echo "Missing computed release version metadata" >&2
          exit 1
        fi
        IMAGE_TAG="${IMAGE_TAG:-$${RELEASE_VERSION}}"
        IMAGE_TAG="$${IMAGE_TAG//+/-}"
        WEB_URL="$$(gcloud run services describe korda-web --region=${_REGION} --format='value(status.url)' 2>/dev/null || echo '')"
        WORKER_URL="$$(gcloud run services describe korda-worker --region=${_REGION} --format='value(status.url)' 2>/dev/null || echo '')"
        APP_URL='${_APP_URL}'
        APP_URL="$${APP_URL:-$${WEB_URL}}"
        ENV_VARS="RELEASE_VERSION=$${RELEASE_VERSION},DJANGO_DEBUG=False,ENABLE_PERIODIC_MAINTENANCE=False,GUNICORN_WORKERS=2"
        ENV_VARS="$${ENV_VARS},GS_BUCKET_NAME=${PROJECT_ID}-media-data-extractor"
        ENV_VARS="$${ENV_VARS},GCP_PROJECT_ID=${PROJECT_ID},GOOGLE_CLOUD_PROJECT=${PROJECT_ID},GCP_REGION=${_REGION}"
        ENV_VARS="$${ENV_VARS},GCP_QUEUE_LOCATION=${_REGION},GCP_QUEUE_NAME=extractor-tasks"
        ENV_VARS="$${ENV_VARS},APP_URL=$${APP_URL},WORKER_URL=$${WORKER_URL}"
        ENV_VARS="$${ENV_VARS},SURREAL_NS=korda,SURREAL_DB=extractor,SURREALDB_OFFLINE=False"
        ENV_VARS="$${ENV_VARS},GEMINI_MODEL=gemini-2.5-flash,GEMINI_MODEL_BATCH=gemini-2.5-flash-lite"
        ENV_VARS="$${ENV_VARS},CLOUD_TASKS_SERVICE_ACCOUNT=${PROJECT_NUMBER}-compute@developer.gserviceaccount.com"
        SECRETS="DJANGO_SECRET_KEY=DJANGO_SECRET_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest"
        SECRETS="$${SECRETS},SURREAL_URL=SURREAL_URL:latest,SURREAL_USER=SURREAL_USER:latest"
        SECRETS="$${SECRETS},SURREAL_PASS=SURREAL_PASS:latest,ADMIN_EMAIL=ADMIN_EMAIL:latest"
        SECRETS="$${SECRETS},SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_PUBLIC_KEY=SUPABASE_PUBLIC_KEY:latest"
        SECRETS="$${SECRETS},SUPABASE_SERVICE_ROLE_KEY=SUPABASE_SERVICE_ROLE_KEY:latest"
        SECRETS="$${SECRETS},CF_TURNSTILE_SITE_KEY=CF_TURNSTILE_SITE_KEY:latest"
        if gcloud secrets describe SUPABASE_DATABASE_URL --project="${PROJECT_ID}" >/dev/null 2>&1; then
          SECRETS="$${SECRETS},DATABASE_URL=SUPABASE_DATABASE_URL:latest"
        fi
        if gcloud secrets describe SENTRY_DSN --project="${PROJECT_ID}" >/dev/null 2>&1; then
          SECRETS="$${SECRETS},SENTRY_DSN=SENTRY_DSN:latest"
        fi
        gcloud run deploy korda-web \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/korda:$${IMAGE_TAG} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --service-account=${PROJECT_NUMBER}-compute@developer.gserviceaccount.com \
          --set-env-vars="$${ENV_VARS}" \
          --set-secrets="$${SECRETS}"

  # 6. Automated Google-Managed Custom Domain Mapping
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:11901dc1a8e6da464f2a7259d503166ab7c55092dbc41373b65c7c676ff6f8f4'
    id: 'bind-custom-domain'
    waitFor: ['deploy-web']
    entrypoint: bash
    args:
      - '-euc'
      - |
        APP_URL='${_APP_URL}'
        if [ -n "$${APP_URL}" ] && [[ "$${APP_URL}" == http* ]]; then
          DOMAIN="$$(echo "$${APP_URL}" | sed -e 's|^[^/]*//||' -e 's|/.*$$||')"
          if [ -n "$${DOMAIN}" ] && [[ "$${DOMAIN}" != *".run.app" ]]; then
            echo "Automating Google-managed domain mapping for $${DOMAIN} in region ${_REGION}..."
            gcloud beta run domain-mappings create \
              --domain="$${DOMAIN}" \
              --service=korda-web \
              --region=${_REGION} \
              --platform=managed \
              --quiet 2>/dev/null || echo "Domain mapping for $${DOMAIN} already exists or is configured."
          fi
        fi

options:
  logging: CLOUD_LOGGING_ONLY
