---
# ==============================================================================
# GCP PRODUCTION BEST PRACTICES CLOUD BUILD PIPELINE (DYNAMIC REGION + VERSION)
# ==============================================================================
# Compliance & Standards:
# - OWASP Container Hardening (Non-Root Execution, Minimal Alpine Base)
# - GCP Cloud Run Production Guidelines (Scale-to-Zero, Health Probes, HTTP/2)
# - GCP Always-Free Tier Safety Limits
#
# Substitution Variables (configure in Cloud Build trigger):
#   _REGION          - GCP region (default: asia-southeast1)
#
# Built-in Cloud Build substitutions used:
#   $PROJECT_ID      - Auto-populated by Cloud Build
#   $PROJECT_NUMBER  - Auto-populated by Cloud Build
#   $SHORT_SHA       - Git short commit SHA (auto-populated by Cloud Build trigger)
#
# RELEASE_VERSION scheme (matches update_docs.py and sonar-project.properties):
#   vMAJOR.MINOR.PATCH
#   MAJOR.MINOR is read from the VERSION file in the repo root.
#   PATCH is derived from the latest release tag and kept stable for Docker/Cloud Run tag safety.
#   We intentionally avoid appending +SHORT_SHA to the image tag because Docker and
#   Cloud Run reject '+' in image tags. The short SHA remains available in the app
#   metadata when needed, but the deployable image tag is the stable semver.
#
# Shell variables inside bash args use $$ to avoid Cloud Build substitution
# conflicts. Cloud Build substitution vars (${_REGION}, ${PROJECT_ID}, etc.)
# use single $ as normal.
# ==============================================================================
substitutions:
  _REGION: asia-southeast1
  # Leave empty for the canonical commit-derived version. A rollback trigger may
  # supply an explicit MAJOR.MINOR.PATCH version.
  _RELEASE_VERSION: ""

steps:
  # 0. Compute dynamic RELEASE_VERSION from VERSION file + git commit count + SHA
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:11901dc1a8e6da464f2a7259d503166ab7c55092dbc41373b65c7c676ff6f8f4'
    id: 'compute-version'
    entrypoint: bash
    args:
      - '-euc'
      - |
        # Compute MAJOR.MINOR from VERSION file
        MAJOR_MINOR=$$(cat VERSION | tr -d '[:space:]' | cut -d. -f1-2)

        release_override='${_RELEASE_VERSION}'
        if [ -n "$${release_override}" ]; then
          RELEASE_VERSION="$${release_override#v}"
          printf '%s' "$${RELEASE_VERSION}" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$$'
        else
          if [ ! -d .git ]; then
            echo "_RELEASE_VERSION is required when the submitted source has no Git metadata" >&2
            exit 1
          fi
          if [ "$$(git rev-parse --is-shallow-repository)" = "true" ]; then
            git fetch --unshallow --no-tags origin
          fi
          PATCH=$$(git rev-list --count HEAD)
          RELEASE_VERSION="$${MAJOR_MINOR}.$${PATCH}"
        fi
        BUILD_SHA="${SHORT_SHA:-}"
        if [ -z "$${BUILD_SHA}" ]; then
          BUILD_SHA=$$(git rev-parse --short HEAD 2>/dev/null || echo "local")
        fi
        IMAGE_TAG="$${RELEASE_VERSION}"
        echo "RELEASE_VERSION=$${RELEASE_VERSION}" > /workspace/release_version.env
        echo "IMAGE_TAG=$${IMAGE_TAG}" >> /workspace/release_version.env
        echo "BUILD_SHA=$${BUILD_SHA}" >> /workspace/release_version.env
        echo "Computed RELEASE_VERSION=$${RELEASE_VERSION}"
        echo "Computed IMAGE_TAG=$${IMAGE_TAG}"

  # 1. Kaniko Container Build with Layer Caching
  # The build must push the exact version tag selected by compute-version so the
  # later deploy steps can reference an image that actually exists in Artifact Registry.
  # The standard executor image is shell-less. This step must source the
  # computed release metadata, so use Kaniko's official BusyBox-enabled image.
  - name: 'gcr.io/kaniko-project/executor@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd'
    id: 'build-image'
    waitFor: ['compute-version']
    entrypoint: /busybox/sh
    args:
      - '-euc'
      - |
        if [ -f /workspace/release_version.env ]; then
          . /workspace/release_version.env
        else
          echo "Missing computed release version metadata" >&2
          exit 1
        fi
        IMAGE_TAG="$${IMAGE_TAG:-$${RELEASE_VERSION}}"
        /kaniko/executor \
          --context=dir:///workspace \
          --dockerfile=/workspace/Dockerfile \
          --destination=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/aetheromni:latest \
          --destination=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/aetheromni:$SHORT_SHA \
          --destination=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/aetheromni:$${IMAGE_TAG} \
          --cache=true \
          --cache-repo=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/aetheromni-cache \
          --cache-ttl=24h \
          --image-download-retry=3 \
          --image-fs-extract-retry=3 \
          --push-retry=3 \
          --reproducible \
          --cleanup

  # 2. Production GCP Cloud Run Web Service Deployment
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:11901dc1a8e6da464f2a7259d503166ab7c55092dbc41373b65c7c676ff6f8f4'
    id: 'deploy-web'
    waitFor: ['build-image']
    entrypoint: bash
    args:
      - '-euc'
      - |
        if [ -f /workspace/release_version.env ]; then
          . /workspace/release_version.env
        else
          echo "Missing computed release version metadata" >&2
          exit 1
        fi
        IMAGE_TAG="${IMAGE_TAG:-$${RELEASE_VERSION}}"
        IMAGE_TAG="$${IMAGE_TAG//+/-}"
        ENV_VARS="RELEASE_VERSION=$${RELEASE_VERSION},DJANGO_DEBUG=False,ENABLE_PERIODIC_MAINTENANCE=False,GUNICORN_WORKERS=2"
        ENV_VARS="$${ENV_VARS},GS_BUCKET_NAME=${PROJECT_ID}-media-data-extractor"
        ENV_VARS="$${ENV_VARS},GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${_REGION}"
        ENV_VARS="$${ENV_VARS},GCP_QUEUE_LOCATION=${_REGION},GCP_QUEUE_NAME=extractor-tasks"
        ENV_VARS="$${ENV_VARS},SURREAL_NS=aetheromni,SURREAL_DB=extractor,SURREALDB_OFFLINE=False"
        ENV_VARS="$${ENV_VARS},GEMINI_MODEL=gemini-3.6-flash,GEMINI_MODEL_BATCH=gemini-3.5-flash-lite"
        SECRETS="DJANGO_SECRET_KEY=DJANGO_SECRET_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest"
        SECRETS="$${SECRETS},SURREAL_URL=SURREAL_URL:latest,SURREAL_USER=SURREAL_USER:latest"
        SECRETS="$${SECRETS},SURREAL_PASS=SURREAL_PASS:latest,ADMIN_EMAIL=ADMIN_EMAIL:latest"
        SECRETS="$${SECRETS}"
        SECRETS="$${SECRETS},SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_PUBLIC_KEY=SUPABASE_PUBLIC_KEY:latest"
        SECRETS="$${SECRETS},CF_TURNSTILE_SITE_KEY=CF_TURNSTILE_SITE_KEY:latest"
        gcloud run deploy aether-web \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/aetheromni:$${IMAGE_TAG} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --service-account=${PROJECT_NUMBER}-compute@developer.gserviceaccount.com \
          --set-env-vars="$${ENV_VARS}" \
          --set-secrets="$${SECRETS}"

  # 3. Production GCP Cloud Run Worker Service Deployment
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk:slim@sha256:11901dc1a8e6da464f2a7259d503166ab7c55092dbc41373b65c7c676ff6f8f4'
    id: 'deploy-worker'
    waitFor: ['build-image']
    entrypoint: bash
    args:
      - '-euc'
      - |
        if [ -f /workspace/release_version.env ]; then
          . /workspace/release_version.env
        else
          echo "Missing computed release version metadata" >&2
          exit 1
        fi
        IMAGE_TAG="${IMAGE_TAG:-$${RELEASE_VERSION}}"
        IMAGE_TAG="$${IMAGE_TAG//+/-}"
        ENV_VARS="RELEASE_VERSION=$${RELEASE_VERSION},DJANGO_DEBUG=False,ENABLE_PERIODIC_MAINTENANCE=True,GUNICORN_WORKERS=1"
        ENV_VARS="$${ENV_VARS},GS_BUCKET_NAME=${PROJECT_ID}-media-data-extractor"
        ENV_VARS="$${ENV_VARS},GCP_PROJECT_ID=${PROJECT_ID},GCP_REGION=${_REGION}"
        ENV_VARS="$${ENV_VARS},GCP_QUEUE_LOCATION=${_REGION},GCP_QUEUE_NAME=extractor-tasks"
        ENV_VARS="$${ENV_VARS},SURREAL_NS=aetheromni,SURREAL_DB=extractor,SURREALDB_OFFLINE=False"
        ENV_VARS="$${ENV_VARS},GEMINI_MODEL=gemini-3.6-flash,GEMINI_MODEL_BATCH=gemini-3.5-flash-lite"
        SECRETS="DJANGO_SECRET_KEY=DJANGO_SECRET_KEY:latest,GEMINI_API_KEY=GEMINI_API_KEY:latest"
        SECRETS="$${SECRETS},SURREAL_URL=SURREAL_URL:latest,SURREAL_USER=SURREAL_USER:latest"
        SECRETS="$${SECRETS},SURREAL_PASS=SURREAL_PASS:latest,ADMIN_EMAIL=ADMIN_EMAIL:latest"
        SECRETS="$${SECRETS}"
        SECRETS="$${SECRETS},SUPABASE_URL=SUPABASE_URL:latest,SUPABASE_PUBLIC_KEY=SUPABASE_PUBLIC_KEY:latest"
        SECRETS="$${SECRETS},CF_TURNSTILE_SITE_KEY=CF_TURNSTILE_SITE_KEY:latest"
        gcloud run deploy aether-worker \
          --image=${_REGION}-docker.pkg.dev/${PROJECT_ID}/cloud-run-source-deploy/aetheromni:$${IMAGE_TAG} \
          --region=${_REGION} \
          --platform=managed \
          --allow-unauthenticated \
          --service-account=${PROJECT_NUMBER}-compute@developer.gserviceaccount.com \
          --set-env-vars="$${ENV_VARS}" \
          --set-secrets="$${SECRETS}"

options:
  logging: CLOUD_LOGGING_ONLY
