name: Automated PR Auto-Merge & Branch Cleanup

# Safety note:
# This workflow intentionally preserves its historical workflow/job names because
# branch protection may require that check context. Its behavior is read-only.
# PR synchronization, conversation handling, merging, and branch pruning are
# performed sequentially by the repository's monitored merge process.
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main, next]
  pull_request_review:
    types: [submitted]
    branches: [main, next]
  push:
    branches: [main, next]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-mergeability-guard-${{ github.event.pull_request.number || github.ref_name }}
  cancel-in-progress: true

jobs:
  manage-pr-lifecycle:
    # Keep this name stable for branch-protection check compatibility.
    name: Auto-Sync, Conflict Guard & Auto-Merge
    runs-on: ubuntu-latest
    steps:
      - name: Inspect PR mergeability without modifying repository state
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_PR_NUMBER: ${{ github.event.pull_request.number }}
          EVENT_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PUSH_REF_NAME: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${EVENT_NAME}" == "pull_request" || "${EVENT_NAME}" == "pull_request_review" ]]; then
            PR_NUMBERS="${EVENT_PR_NUMBER}"
          else
            # A base-branch push can change mergeability for every PR targeting it.
            PR_NUMBERS="$(gh pr list               --repo "${GH_REPO}"               --state open               --base "${PUSH_REF_NAME}"               --json number               --jq '.[].number')"
          fi

          if [[ -z "${PR_NUMBERS}" ]]; then
            echo "No open pull requests require mergeability inspection."
            exit 0
          fi

          FAILED=0

          for PR in ${PR_NUMBERS}; do
            [[ -z "${PR}" ]] && continue
            echo "Inspecting PR #${PR}."

            if ! DETAILS="$(gh pr view "${PR}"               --repo "${GH_REPO}"               --json number,isDraft,baseRefName,headRefName,headRefOid,mergeable,mergeStateStatus,reviewDecision,autoMergeRequest)"; then
              echo "::error title=PR inspection failed::Unable to inspect PR #${PR}; refusing to report it safe."
              FAILED=1
              continue
            fi

            MERGEABLE_STATE="$(jq -r '.mergeable // "UNKNOWN"' <<<"${DETAILS}")"
            RETRY_COUNT=0

            while [[ "${MERGEABLE_STATE}" == "UNKNOWN" && ${RETRY_COUNT} -lt 6 ]]; do
              echo "GitHub is still calculating PR #${PR} mergeability (attempt $((RETRY_COUNT + 1))/6)."
              sleep 5
              RETRY_COUNT=$((RETRY_COUNT + 1))
              MERGEABLE_STATE="$(gh pr view "${PR}"                 --repo "${GH_REPO}"                 --json mergeable                 --jq '.mergeable // "UNKNOWN"' 2>/dev/null || echo "UNKNOWN")"
            done

            IS_DRAFT="$(jq -r '.isDraft' <<<"${DETAILS}")"
            BASE_REF="$(jq -r '.baseRefName' <<<"${DETAILS}")"
            HEAD_REF="$(jq -r '.headRefName' <<<"${DETAILS}")"
            HEAD_SHA="$(jq -r '.headRefOid' <<<"${DETAILS}")"
            MERGE_STATE_STATUS="$(jq -r '.mergeStateStatus // "UNKNOWN"' <<<"${DETAILS}")"
            REVIEW_DECISION="$(jq -r '.reviewDecision // "UNSET"' <<<"${DETAILS}")"
            AUTO_MERGE_ENABLED="$(jq -r 'if .autoMergeRequest == null then "false" else "true" end' <<<"${DETAILS}")"

            {
              echo "### PR #${PR} mergeability guard"
              echo
              echo "- Branch: \`${HEAD_REF}\` → \`${BASE_REF}\`"
              echo "- Head: \`${HEAD_SHA}\`"
              echo "- Draft: \`${IS_DRAFT}\`"
              echo "- Mergeable: \`${MERGEABLE_STATE}\`"
              echo "- Merge state: \`${MERGE_STATE_STATUS}\`"
              echo "- Review decision: \`${REVIEW_DECISION}\`"
              echo "- Existing auto-merge request: \`${AUTO_MERGE_ENABLED}\`"
              echo
            } >> "${GITHUB_STEP_SUMMARY}"

            if [[ "${AUTO_MERGE_ENABLED}" == "true" ]]; then
              echo "::warning title=Existing auto-merge request::PR #${PR} already has auto-merge enabled. This guard will not alter it."
            fi

            case "${MERGEABLE_STATE}" in
              MERGEABLE)
                echo "PR #${PR} has no GitHub-detected merge conflict."
                ;;
              CONFLICTING)
                echo "::error title=Merge conflict detected::PR #${PR} conflicts with ${BASE_REF}. No branch update or merge was attempted."
                FAILED=1
                ;;
              *)
                echo "::error title=Mergeability unresolved::PR #${PR} remained ${MERGEABLE_STATE}. No branch update or merge was attempted."
                FAILED=1
                ;;
            esac
          done

          exit "${FAILED}"
