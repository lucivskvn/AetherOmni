name: Set SonarQube Badge Visibility

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  set-badge-visibility:
    name: Make SonarQube project badges public
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set project visibility to public
        env:
          SONAR_HOST_URL: https://sonarqube.fainko.cloud
          SONAR_PROJECT_KEY: aetheromni
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          curl --fail --silent --show-error \
            --user "${SONAR_TOKEN}:" \
            --request POST \
            --data-urlencode "project=${SONAR_PROJECT_KEY}" \
            --data-urlencode 'visibility=public' \
            "${SONAR_HOST_URL}/api/projects/update_visibility"

      - name: Verify anonymous badge access
        env:
          SONAR_HOST_URL: https://sonarqube.fainko.cloud
          SONAR_PROJECT_KEY: aetheromni
        run: |
          set -euo pipefail
          badge=$(curl --fail --silent --show-error \
            "${SONAR_HOST_URL}/api/project_badges/measure?project=${SONAR_PROJECT_KEY}&metric=alert_status")
          if grep -q 'Project has not been found' <<< "$badge"; then
            echo 'SonarQube badge remains inaccessible anonymously.' >&2
            exit 1
          fi
          echo 'SonarQube badge is publicly accessible.' >> "$GITHUB_STEP_SUMMARY"
