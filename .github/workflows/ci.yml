# ==============================================================================
# GITHUB ACTIONS CI PIPELINE — CLOUD-ONLY QA GATE
# ==============================================================================
# Architecture:
#   All security scanning and quality gating is delegated exclusively to
#   cloud services. No local SAST (bandit, ast-grep) in CI — cloud scanners
#   run more comprehensive rulesets server-side.
#
#   Phase 1 ─ Pre-Scan          → Hadolint Dockerfile lint + shell syntax
#   Phase 2 ─ Tests & Coverage  → ruff (linting) + eslint (linting)
#                                  Python tests → coverage.xml
#                                  JS tests     → coverage/js/lcov.info
#   Phase 3 ─ SonarCloud Gate   → Full SAST (3000+ rules) + coverage
#                                  ingestion + quality gate enforcement
#   Phase 4 ─ Semgrep Cloud     → Pro rules + secrets detection + custom
#   (parallel to 3)               policies → SARIF → GitHub Advanced Security
#
# Required secrets: SONAR_TOKEN, SEMGREP_APP_TOKEN
# ==============================================================================
name: DevSecOps CI Pipeline

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, next]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Principle of Least Privilege: Default to read-only at workflow level
permissions:
  contents: read

jobs:
  # ============================================================================
  # Phase 1: Pre-Scan Validation
  # Fast infrastructure sanity check. Runs first so subsequent cloud scans
  # don't waste compute on obviously broken Dockerfiles or shell scripts.
  # ============================================================================
  pre-scan-validation:
    name: 1. Pre-Scan Validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dockerfile & Script Validation
        run: |
          if [[ -f Dockerfile ]]; then
            docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint - < Dockerfile
          fi
          if [[ -f scripts/verify-pipeline.sh ]]; then
            bash -n scripts/verify-pipeline.sh
          fi

  # ============================================================================
  # Phase 2: Tests & Coverage Generation
  # Runs linters for immediate developer feedback + all tests to generate
  # coverage artifacts consumed by SonarCloud in Phase 3.
  # ============================================================================
  tests-and-coverage:
    name: 2. Tests & Coverage
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pre-scan-validation
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Required for SonarCloud SCM blame data

      - name: Cache Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.sonar/cache
          key: ${{ runner.os }}-deps-${{ hashFiles('**/requirements.txt', '**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Compute Canonical Analysis Version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          major_minor=$(tr -d '[:space:]' < VERSION)
          [[ "$major_minor" =~ ^[0-9]+\.[0-9]+$ ]]
          patch=$(git rev-list --count HEAD)
          version="${major_minor}.${patch}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "### Analysis version: \`${version}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python Dependencies
        run: |
          pip install --no-cache-dir --only-binary :all: --upgrade pip==26.0.1
          pip install --no-cache-dir --only-binary :all: -r requirements.txt coverage==7.15.4 ruff==0.16.2 --quiet

      - name: Install Node Dependencies
        run: |
          npm ci --prefer-offline --ignore-scripts

      - name: Python Lint (ruff)
        run: ruff check .

      - name: JavaScript Lint (eslint)
        run: ./node_modules/.bin/eslint --no-warn-ignored --max-warnings 0 static/js/**/*.js

      - name: Python Tests → coverage.xml
        run: |
          export DJANGO_SECRET_KEY="django-insecure-ci-test-key-50-chars-long-for-local-testing"
          python scripts/verify_templates_and_assets.py
          python manage.py collectstatic --noinput
          coverage run --source='core,extractor' manage.py test extractor.tests --keepdb
          coverage xml -o coverage.xml
        env:
          SURREALDB_OFFLINE: "True"
          DATABASE_URL: "sqlite:///:memory:"

      - name: JavaScript Tests → coverage/js/lcov.info
        run: |
          npm run test:coverage

      - name: Upload Coverage Artifacts for SonarCloud
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: coverage-reports-${{ github.sha }}
          path: |
            coverage.xml
            coverage/js/lcov.info
          retention-days: 1

  # ============================================================================
  # Phase 3: SonarCloud Quality Gate (Cloud SAST + Coverage + Gate Enforcement)
  # Downloads coverage from Phase 2, runs full SonarCloud analysis, then polls
  # the quality gate and fails the pipeline if it doesn't pass.
  # ============================================================================
  sonarcloud-quality-gate:
    name: 3. SonarCloud Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tests-and-coverage
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache SonarCloud Engine
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/sonar-project.properties') }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Download Coverage Reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: coverage-reports-${{ github.sha }}

      - name: Validate SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "::error title=Missing SONAR_TOKEN::Generate a User Token at https://sonarcloud.io/account/security and store it as the SONAR_TOKEN repository secret."
            exit 1
          fi
          http_code=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/authentication/validate")
          if [[ "$http_code" != "200" ]]; then
            echo "::error title=Invalid SONAR_TOKEN::Token rejected (HTTP ${http_code}). Regenerate at https://sonarcloud.io/account/security"
            exit 1
          fi
          echo "SONAR_TOKEN validated (HTTP 200)"

      - name: Run SonarCloud Analysis
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=lucivskvn
            -Dsonar.projectKey=lucivskvn_AetherOmni
            -Dsonar.projectName=AetherOmni
            -Dsonar.scm.provider=git
            -Dsonar.projectVersion=${{ needs.tests-and-coverage.outputs.version }}
            -Dsonar.threads=4
            -Dsonar.analysis.cache.enabled=true

      - name: SonarCloud Quality Gate Check
        id: quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Publish Quality Gate Result
        if: always()
        env:
          QUALITY_GATE_STATUS: ${{ steps.quality-gate.outputs.quality-gate-status }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_DASHBOARD_URL: https://sonarcloud.io/summary/new_code?id=lucivskvn_AetherOmni
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ "$QUALITY_GATE_STATUS" = "PASSED" ]; then
            result="passed"
          elif [ "$QUALITY_GATE_STATUS" = "WARN" ]; then
            result="warning"
          else
            result="failed"
          fi

          summary_file="${RUNNER_TEMP}/sonarcloud-quality-gate.md"
          gate_payload=""
          if [ -n "$QUALITY_GATE_STATUS" ]; then
            quality_gate_url="${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=lucivskvn_AetherOmni"
            if [ -n "$SONAR_PULL_REQUEST" ]; then
              quality_gate_url="${quality_gate_url}&pullRequest=${SONAR_PULL_REQUEST}"
            fi
            gate_payload=$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$quality_gate_url" || true)
          fi

          {
            echo "### SonarCloud Quality Gate: ${result}"
            echo
            echo "| Status | Dashboard |"
            echo "| --- | --- |"
            echo "| ${QUALITY_GATE_STATUS:-UNAVAILABLE} | [Open SonarCloud dashboard](${SONAR_DASHBOARD_URL}) |"

            if [ -n "$QUALITY_GATE_STATUS" ]; then
              echo
              echo "| Metric | Status | Threshold | Actual |"
              echo "| --- | --- | --- | --- |"
              if [ -n "$gate_payload" ]; then
                jq -r '.projectStatus.conditions[]? | "| \(.metricKey) | \(.status) | \(.errorThreshold // "—") | \(.actualValue // "—") |"' <<< "$gate_payload"
              else
                echo "| Quality-gate details unavailable | — | — | — |"
              fi
            fi
          } | tee "$summary_file"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$gate_payload" ]; then
            jq -r '
              .projectStatus.conditions[]?
              | select(.status != "OK")
              | "::error title=SonarCloud \(.metricKey)::Threshold \(.errorThreshold // "not reported"), actual \(.actualValue // "not reported")"
            ' <<< "$gate_payload"
          fi

          if [ "$QUALITY_GATE_STATUS" != "PASSED" ]; then
            echo "::error title=SonarCloud Quality Gate ${result}::Review ${SONAR_DASHBOARD_URL}"
            exit 1
          fi

  # ============================================================================
  # Phase 4: Semgrep Cloud SAST (runs in parallel with SonarCloud)
  # Pro rules (3500+), secrets detection, and organization custom policies
  # configured in the Semgrep Cloud dashboard. Results uploaded as SARIF to
  # GitHub Advanced Security for inline PR annotations.
  # ============================================================================
  semgrep-cloud-sast:
    name: 4. Semgrep Cloud SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre-scan-validation
    permissions:
      contents: read
      pull-requests: read
      security-events: write
    # Skip on Dependabot PRs — SEMGREP_APP_TOKEN unavailable in forked PRs
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate SEMGREP_APP_TOKEN
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo "::error title=Missing SEMGREP_APP_TOKEN::Generate a token at https://semgrep.dev/orgs/-/settings/tokens and store it as the SEMGREP_APP_TOKEN repository secret."
            exit 1
          fi
          echo "SEMGREP_APP_TOKEN is present"

      - name: Run Semgrep Cloud Analysis
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          docker run --rm \
            -v "${{ github.workspace }}:/src" \
            -e SEMGREP_APP_TOKEN \
            semgrep/semgrep@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b semgrep ci --sarif --output=semgrep.sarif || true

      - name: Upload Semgrep SARIF to GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@67ba681cdcbc95ed0371c210ccf82c4d968ae5eb # v3.37.7
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true
