# ==============================================================================
# GITHUB ACTIONS ENTERPRISE CI PIPELINE (SONARCLOUD + SEMGREP CLOUD)
# ==============================================================================
# Security & Performance Standards:
# - Pinned action releases maintained by Dependabot
# - Least-privilege repository token (contents: read, pull-requests: write)
# - Bounded job execution time
# - Dual-Layer Caching (Dependency, SonarCloud Engine & Semgrep rules)
# - 4-Phase Gatekeeper:
#     1. Pre-Scan       → Hadolint + script syntax validation
#     2. SonarCloud     → SAST + Django tests + coverage + quality gate
#     3. Semgrep Cloud  → Pro rules + secrets + custom policies (Cloud ruleset)
#     4. (cloud checks) → CodeQL, Aikido, GitGuardian run in parallel
# Required secrets: SONAR_TOKEN, SEMGREP_APP_TOKEN
# ==============================================================================
name: DevSecOps CI Pipeline

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, next]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  security-events: write  # Required for Semgrep SARIF upload

jobs:
  pre-scan-validation:
    name: 1. Pre-Scan Validation & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Package & Engine Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.sonar/cache
          key: ${{ runner.os }}-dep-${{ hashFiles('**/requirements.txt', '**/package-lock.json', '**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-dep-

      - name: Pre-Scan Container & Script Validation
        run: |
          if [ -f Dockerfile ]; then
            docker run --rm -i hadolint/hadolint hadolint - < Dockerfile
          fi
          if [ -f scripts/verify-pipeline.sh ]; then
            bash -n scripts/verify-pipeline.sh
          fi

  sonarcloud-quality-gate:
    name: 2. SonarCloud Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre-scan-validation
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Cache SonarCloud Engine & Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.sonar/cache
          key: ${{ runner.os }}-sonar-${{ hashFiles('**/requirements.txt') }}
          restore-keys: ${{ runner.os }}-sonar-

      - name: Compute canonical analysis version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          major_minor=$(tr -d '[:space:]' < VERSION)
          [[ "$major_minor" =~ ^[0-9]+\.[0-9]+$ ]]
          patch=$(git rev-list --count HEAD)
          version="${major_minor}.${patch}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "### Analysis version: \`${version}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Install Dependencies & Security Tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage==7.15.4 --quiet
          python -m venv .ci-security-tools
          .ci-security-tools/bin/pip install --upgrade pip --quiet
          .ci-security-tools/bin/pip install ast-grep-cli==0.45.1 ruff==0.16.2 bandit==1.9.4 --quiet

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Execute Shift-Left Security & Automated Tests
        run: |
          export DJANGO_SECRET_KEY="django-insecure-ci-test-key-50-chars-long-for-local-testing"
          .ci-security-tools/bin/ruff check .
          npx -y eslint --max-warnings 0 static/js/**/*.js
          .ci-security-tools/bin/ast-grep scan --color never
          yamllint bandit.yaml docker-compose.yml
          .ci-security-tools/bin/bandit -c bandit.yaml -r core extractor
          python scripts/verify_templates_and_assets.py
          python manage.py collectstatic --noinput
          coverage run --source='core,extractor' manage.py test extractor.tests --keepdb
          coverage xml -o coverage.xml
        env:
          SURREALDB_OFFLINE: "True"
          DATABASE_URL: "sqlite:///:memory:"

      - name: Run JavaScript Tests & Generate LCOV Coverage
        run: |
          npm ci --prefer-offline
          npm run test:coverage

      - name: Validate SONAR_TOKEN against SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SONAR_TOKEN:-}" ]; then
            echo "::error title=Missing SONAR_TOKEN::Generate a User Token at https://sonarcloud.io/account/security and store it as the SONAR_TOKEN repository secret."
            exit 1
          fi
          http_code=$(curl --silent --output /dev/null --write-out "%{http_code}" \
            -H "Authorization: Bearer ${SONAR_TOKEN}" \
            "https://sonarcloud.io/api/authentication/validate")
          if [ "$http_code" != "200" ]; then
            echo "::error title=Invalid SONAR_TOKEN (HTTP ${http_code})::The SONAR_TOKEN secret was rejected by SonarCloud (HTTP ${http_code}). Regenerate a User Token scoped to the 'lucivskvn' organization at https://sonarcloud.io/account/security and update the SONAR_TOKEN repository secret."
            exit 1
          fi
          echo "SONAR_TOKEN validated successfully (HTTP 200)"

      - name: Run SonarCloud Analysis
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.organization=lucivskvn
            -Dsonar.projectKey=lucivskvn_AetherOmni
            -Dsonar.projectName=AetherOmni
            -Dsonar.scm.provider=git
            -Dsonar.projectVersion=${{ steps.release-version.outputs.version }}
            -Dsonar.threads=4
            -Dsonar.analysis.cache.enabled=true

      - name: 3. SonarCloud Quality Gate Status Check
        id: quality-gate
        uses: SonarSource/sonarqube-quality-gate-action@7a5fffe8e523c40e0c740b6bc2712ab503e52efa # v1.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io

      - name: Publish SonarCloud quality gate result
        if: always()
        env:
          QUALITY_GATE_STATUS: ${{ steps.quality-gate.outputs.quality-gate-status }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_DASHBOARD_URL: https://sonarcloud.io/summary/new_code?id=lucivskvn_AetherOmni
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          if [ "$QUALITY_GATE_STATUS" = "PASSED" ]; then
            result="passed"
          elif [ "$QUALITY_GATE_STATUS" = "WARN" ]; then
            result="warning"
          else
            result="failed"
          fi

          summary_file="${RUNNER_TEMP}/sonarcloud-quality-gate.md"
          gate_payload=""
          if [ -n "$QUALITY_GATE_STATUS" ]; then
            quality_gate_url="${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=lucivskvn_AetherOmni"
            if [ -n "$SONAR_PULL_REQUEST" ]; then
              quality_gate_url="${quality_gate_url}&pullRequest=${SONAR_PULL_REQUEST}"
            fi
            gate_payload=$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$quality_gate_url" || true)
          fi

          {
            echo "### SonarCloud Quality Gate: ${result}"
            echo
            echo "| Status | Dashboard |"
            echo "| --- | --- |"
            echo "| ${QUALITY_GATE_STATUS:-UNAVAILABLE} | [Open SonarCloud dashboard](${SONAR_DASHBOARD_URL}) |"

            if [ -n "$QUALITY_GATE_STATUS" ]; then
              echo
              echo "| Metric | Status | Threshold | Actual |"
              echo "| --- | --- | --- | --- |"
              if [ -n "$gate_payload" ]; then
                jq -r '.projectStatus.conditions[]? | "| \(.metricKey) | \(.status) | \(.errorThreshold // "—") | \(.actualValue // "—") |"' <<< "$gate_payload"
              else
                echo "| Quality-gate details unavailable | — | — | — |"
              fi
            fi
          } | tee "$summary_file"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"
          if [ -n "$gate_payload" ]; then
            jq -r '
              .projectStatus.conditions[]?
              | select(.status != "OK")
              | "::error title=SonarCloud \(.metricKey)::Threshold \(.errorThreshold // "not reported"), actual \(.actualValue // "not reported")"
            ' <<< "$gate_payload"
          fi

          if [ "$QUALITY_GATE_STATUS" != "PASSED" ]; then
            echo "::error title=SonarCloud Quality Gate ${result}::Review ${SONAR_DASHBOARD_URL}"
            exit 1
          fi

  semgrep-cloud-sast:
    name: 3. Semgrep Cloud SAST
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre-scan-validation
    # Skip on Dependabot PRs — SEMGREP_APP_TOKEN is not available to forked PRs
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Validate SEMGREP_APP_TOKEN
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${SEMGREP_APP_TOKEN:-}" ]; then
            echo "::error title=Missing SEMGREP_APP_TOKEN::Generate a token at https://semgrep.dev/orgs/-/settings/tokens and store it as the SEMGREP_APP_TOKEN repository secret."
            exit 1
          fi
          echo "SEMGREP_APP_TOKEN is present"

      - name: Run Semgrep Cloud Analysis
        uses: semgrep/semgrep-action@713efdd345f3035192eaa63f56867b88e63e4e5d # v1
        env:
          SEMGREP_APP_TOKEN: ${{ secrets.SEMGREP_APP_TOKEN }}
        with:
          # publishToken connects to Semgrep Cloud and pulls all configured
          # Pro rules, secrets detection, and custom policies from the dashboard.
          # Results are posted back as PR comments and the SARIF is uploaded.
          publishToken: ${{ secrets.SEMGREP_APP_TOKEN }}
          publishDeployment: ${{ github.repository_id }}
          generateSarif: "1"

      - name: Upload Semgrep SARIF to GitHub Advanced Security
        uses: github/codeql-action/upload-sarif@4b6aa0b07da05d6e43d0e5f9c8596a6532ce8b37 # v3.28.16
        if: always()
        with:
          sarif_file: semgrep.sarif
        continue-on-error: true
