# ==============================================================================
# GITHUB ACTIONS CI PIPELINE — SHIFT-LEFT QA & SECURITY GATE
# ==============================================================================
# Architecture:
#   Phase 1 ─ Pre-Scan          → Hadolint Dockerfile lint + ShellCheck
#                                  AST-Grep custom patterns + pip-audit supply chain
#                                  surreal validate SurrealQL schema
#   Phase 2 ─ Tests & Coverage  → ruff (linting) + eslint (linting)
#                                  bandit (Python SAST) + mypy (type checking)
#                                  Python tests → coverage.xml
#                                  JS tests     → coverage/js/lcov.info
#
# GitHub-managed CodeQL and the SonarCloud GitHub integration publish their
# own code-scanning results. This workflow publishes blocking Semgrep SARIF.
# ==============================================================================
name: DevSecOps CI Pipeline

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, next]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Phase 1: Pre-Scan Validation & Security Audit
  # Fast infrastructure sanity check. Runs first so subsequent cloud scans
  # don't waste compute on obviously broken Dockerfiles or shell scripts.
  # ============================================================================
  pre-scan-validation:
    name: 1. Pre-Scan Validation & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dockerfile & Script Validation (Hadolint)
        run: |
          if [[ -f Dockerfile ]]; then
            docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint - < Dockerfile
          fi
          if [[ -f scripts/verify-pipeline.sh ]]; then
            bash -n scripts/verify-pipeline.sh
          fi

      - name: ShellCheck Shell Script Audit
        run: |
          if command -v shellcheck &>/dev/null; then
            shellcheck run_checks.sh scripts/*.sh
          else
            sudo apt-get install -y --no-install-recommends shellcheck
            shellcheck run_checks.sh scripts/*.sh
          fi

      - name: AST-Grep Custom Pattern Scan
        run: |
          if ! command -v ast-grep &>/dev/null; then
            npm install -g --ignore-scripts @ast-grep/cli@0.45.1 --silent
          fi
          AST_OUTPUT=$(ast-grep scan --color never 2>&1)
          AST_ERRORS=$(echo "$AST_OUTPUT" | grep -c '^error' || true)
          if [[ "$AST_ERRORS" -gt 0 ]]; then
            echo "$AST_OUTPUT"
            echo "::error title=AST-Grep::$AST_ERRORS pattern error(s) found. Fix before merging."
            exit 1
          fi
          echo "AST-Grep scan: 0 errors"

      - name: Setup Python (for pip-audit and surreal validate)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Supply Chain Audit (pip-audit)
        run: |
          pip install --no-cache-dir --only-binary :all: pip-audit==2.10.1 --quiet
          pip-audit -r requirements.txt

      - name: SurrealQL Schema Validation
        run: |
          if command -v surreal &>/dev/null; then
            SURQL_FILES=$(find . -name "*.surql" -not -path "./.git/*" -not -path "./.venv/*" | tr '\n' ' ')
            if [[ -n "$SURQL_FILES" ]]; then
              # shellcheck disable=SC2086
              surreal validate $SURQL_FILES
            fi
          else
            echo "::notice title=SurrealQL::surreal CLI not installed in runner. Install for local validation."
          fi

  # ============================================================================
  # Phase 2: Tests & Coverage Generation (PR Shift-Left Security Gate)
  # Runs linters for immediate developer feedback + all tests to generate
  # coverage artifacts consumed by GitHub and external code-scanning tools.
  # ============================================================================
  tests-and-coverage:
    name: 2. PR Shift-Left Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pre-scan-validation
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Cache Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: ${{ runner.os }}-deps-${{ hashFiles('**/requirements.txt', '**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python Dependencies
        run: |
          pip install --no-cache-dir --only-binary :all: --upgrade pip==26.0.1
          pip install --no-cache-dir --only-binary :all: -r requirements-dev.txt --quiet  # NOSONAR githubactions:S8544 -- Included requirements are exact-pinned.
          python -m venv .semgrep-venv
          .semgrep-venv/bin/pip install --no-cache-dir --only-binary :all: --upgrade pip==26.0.1 --quiet
          .semgrep-venv/bin/pip install --no-cache-dir --only-binary :all: semgrep==1.176.1 --quiet

      - name: Install Node Dependencies
        run: |
          npm ci --prefer-offline --ignore-scripts

      - name: Python Lint (ruff)
        run: ruff check .

      - name: Code Quality & Cognitive Complexity Gate
        run: python scripts/check_code_quality.py

      - name: Reliability Contract Gate
        run: python scripts/check_reliability_contracts.py

      - name: Bandit Python Security Audit
        run: python -m bandit -c bandit.yaml -r extractor/ core/ scripts/ -ll

      - name: Mypy Static Type Check
        run: python -m mypy --ignore-missing-imports core/ extractor/

      - name: Django Schema Migration Drift Gate
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: "ci-test-key-50-chars-long-for-local-testing-7Tn4Qp9Wm2Kx8Vz5Hr6Ls3Bc1Df"
          SURREALDB_OFFLINE: "True"
          DATABASE_URL: "sqlite:///:memory:"

      - name: JavaScript Lint (eslint)
        run: ./node_modules/.bin/eslint --no-warn-ignored --max-warnings 0 "static/js/**/*.js"

      - name: Pulumi IaC Stack Gate
        run: |
          python -m ruff check infra/pulumi/
          python -m ruff format --check infra/pulumi/

      - name: Python Tests → coverage.xml
        run: |
          export DJANGO_SECRET_KEY="ci-test-key-50-chars-long-for-local-testing-7Tn4Qp9Wm2Kx8Vz5Hr6Ls3Bc1Df"
          python scripts/verify_templates_and_assets.py
          python manage.py collectstatic --noinput
          rm -f .coverage .coverage.* coverage.xml

          BATCH_DISPATCHER=$(python -c "
          import glob
          modules = [
              p.replace('/', '.').removesuffix('.py')
              for p in sorted(glob.glob('core/tests/**/test_*.py', recursive=True) + glob.glob('extractor/tests/**/test_*.py', recursive=True))
              if not p.endswith('__init__.py')
          ]
          view_mods = [m for m in modules if 'test_views' in m]
          non_view_mods = [m for m in modules if 'test_views' not in m]
          chunk_size = 10
          batches = [non_view_mods[i:i+chunk_size] for i in range(0, len(non_view_mods), chunk_size)]
          if view_mods:
              batches.append(view_mods)
          for b in batches:
              print(' '.join(b))
          ")

          while IFS= read -r BATCH_MODULES; do
              [[ -z "$BATCH_MODULES" ]] && continue
              coverage run -p manage.py test $BATCH_MODULES --keepdb --buffer
          done <<< "$BATCH_DISPATCHER"

          coverage combine
          coverage xml -o coverage.xml
        env:
          SURREALDB_OFFLINE: "True"
          DATABASE_URL: "sqlite:///:memory:"
          MALLOC_ARENA_MAX: "2"

      - name: JavaScript Tests → coverage/js/lcov.info
        run: |
          npm run test:coverage

      - name: Generate Semgrep SARIF
        id: semgrep
        continue-on-error: true
        run: .semgrep-venv/bin/semgrep scan --config=auto --error --sarif --output=semgrep.sarif

      - name: Publish Semgrep SARIF to GitHub code scanning
        if: |
          always() &&
          hashFiles('semgrep.sarif') != '' &&
          (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
        # github/codeql-action v4.37.9
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938
        with:
          sarif_file: semgrep.sarif
          category: semgrep

      - name: Enforce Semgrep findings gate
        if: steps.semgrep.outcome == 'failure'
        run: exit 1

  dependency-review:
    name: Dependency Review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Review dependency changes
        # actions/dependency-review-action v5.0.0
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294
        with:
          fail-on-severity: moderate

  zizmor:
    name: GitHub Actions Security (zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit workflow security
        # zizmorcore/zizmor-action v0.6.4
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482
        with:
          advanced-security: true
          token: ${{ secrets.GITHUB_TOKEN }}
          version: 1.30.1
