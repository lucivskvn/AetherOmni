# ==============================================================================
# GITHUB ACTIONS ENTERPRISE CI PIPELINE
# ==============================================================================
# Security & Performance Standards:
# - Pinned action releases maintained by Dependabot
# - Least-privilege repository token (contents: read)
# - Bounded job execution time
# - Dual-Layer Caching (Dependency & Sonar Engine)
# - 3-Phase Gatekeeper (Pre-Scan -> SonarQube SAST -> Post-Scan Quality Gate)
# ==============================================================================
name: DevSecOps CI Pipeline

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, next]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pre-scan-validation:
    name: 1. Pre-Scan Validation & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Cache Package & Engine Dependencies
        uses: actions/cache@v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.npm
            ~/.sonar/cache
          key: ${{ runner.os }}-dep-${{ hashFiles('**/requirements.txt', '**/package-lock.json', '**/bun.lockb') }}
          restore-keys: ${{ runner.os }}-dep-

      - name: Pre-Scan Container & Script Validation
        run: |
          if [ -f Dockerfile ]; then
            docker run --rm -i hadolint/hadolint hadolint - < Dockerfile
          fi
          if [ -f scripts/verify-pipeline.sh ]; then
            bash -n scripts/verify-pipeline.sh
          fi

  pr-shift-left-security:
    name: 2. PR Shift-Left Security Gate
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre-scan-validation
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install PR verification tools
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage ruff bandit semgrep --quiet

      - name: Run PR security and test gate
        run: |
          export DJANGO_SECRET_KEY="django-insecure-ci-test-key-50-chars-long-for-local-testing"
          ruff check .
          npx -y eslint --max-warnings 0 static/js/**/*.js
          semgrep scan --config=auto --quiet --error
          bandit -c bandit.yaml -r core extractor
          python manage.py collectstatic --noinput
          coverage run --source='core,extractor' manage.py test --keepdb
        env:
          SURREALDB_OFFLINE: "True"
          DATABASE_URL: "sqlite:///:memory:"

      - name: Explain Community Edition scope
        if: always()
        run: |
          {
            echo '### Community Edition PR gate'
            echo
            echo 'SonarQube Community Edition does not support pull-request analysis.'
            echo 'This PR is protected by repository-native Ruff, ESLint, Semgrep, Bandit, tests, CodeQL, and the external security checks.'
            echo 'SonarQube performs its authoritative project analysis and quality gate only after a push to `main`.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Publish SonarQube mainline baseline
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarqube.fainko.cloud
        run: |
          set -euo pipefail

          quality_gate_url="${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=aetheromni"
          {
            echo
            echo '### SonarQube Community Edition mainline baseline'
            echo
            echo 'This is the current `main` project status, not a pull-request analysis.'
            echo '| Status | Dashboard |'
            echo '| --- | --- |'

            if gate_payload=$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$quality_gate_url"); then
              gate_status=$(jq -r '.projectStatus.status // "UNAVAILABLE"' <<< "$gate_payload")
              echo "| ${gate_status} | [Open SonarQube dashboard](${SONAR_HOST_URL}/dashboard?id=aetheromni) |"
              echo
              echo '| Metric | Status | Threshold | Actual |'
              echo '| --- | --- | --- | --- |'
              jq -r '.projectStatus.conditions[]? | "| \(.metricKey) | \(.status) | \(.errorThreshold // "—") | \(.actualValue // "—") |"' <<< "$gate_payload"
            else
              echo "| UNAVAILABLE | [Open SonarQube dashboard](${SONAR_HOST_URL}/dashboard?id=aetheromni) |"
              echo
              echo '| Metric | Status | Threshold | Actual |'
              echo '| --- | --- | --- | --- |'
              echo '| Server response unavailable | — | — | — |'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  sonarqube-mainline-analysis:
    name: 2. SonarQube Community Mainline Gate
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: pre-scan-validation
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Cache SonarQube Engine
        uses: actions/cache@v6.1.0
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Compute canonical analysis version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          major_minor=$(tr -d '[:space:]' < VERSION)
          [[ "$major_minor" =~ ^[0-9]+\.[0-9]+$ ]]
          patch=$(git rev-list --count HEAD)
          version="${major_minor}.${patch}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "### Analysis version: \`${version}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Install Dependencies for Coverage
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage --quiet

      - name: Execute Tests & Generate Coverage XML
        run: |
          export DJANGO_SECRET_KEY="django-insecure-ci-test-key-50-chars-long-for-local-testing"
          python manage.py collectstatic --noinput && coverage run --source='core,extractor' manage.py test --keepdb
          coverage xml -o coverage.xml
        env:
          SURREALDB_OFFLINE: "True"
          DATABASE_URL: "sqlite:///:memory:"

      - name: Run SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarqube.fainko.cloud
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.scm.provider=git
            -Dsonar.projectVersion=${{ steps.release-version.outputs.version }}
            -Dsonar.threads=4
            -Dsonar.analysis.cache.enabled=true

      - name: 3. SonarQube Quality Gate Status Check
        id: quality-gate
        continue-on-error: true
        uses: SonarSource/sonarqube-quality-gate-action@v1.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarqube.fainko.cloud

      - name: Publish SonarQube quality gate result
        if: always()
        env:
          QUALITY_GATE_STATUS: ${{ steps.quality-gate.outputs.quality-gate-status }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_DASHBOARD_URL: https://sonarqube.fainko.cloud/dashboard?id=aetheromni
          SONAR_HOST_URL: https://sonarqube.fainko.cloud
          SONAR_PULL_REQUEST: ''
        run: |
          set -euo pipefail

          if [ "$QUALITY_GATE_STATUS" = "PASSED" ]; then
            result="passed"
          elif [ "$QUALITY_GATE_STATUS" = "WARN" ]; then
            result="warning"
          else
            result="failed"
          fi

          {
            echo "### SonarQube Quality Gate: ${result}"
            echo
            echo "| Status | Dashboard |"
            echo "| --- | --- |"
            echo "| ${QUALITY_GATE_STATUS:-UNAVAILABLE} | [Open SonarQube dashboard](${SONAR_DASHBOARD_URL}) |"

            if [ -n "$QUALITY_GATE_STATUS" ]; then
              quality_gate_url="${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=aetheromni"
              if [ -n "$SONAR_PULL_REQUEST" ]; then
                quality_gate_url="${quality_gate_url}&pullRequest=${SONAR_PULL_REQUEST}"
              fi

              echo
              echo "| Metric | Status | Threshold | Actual |"
              echo "| --- | --- | --- | --- |"
              if gate_payload=$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$quality_gate_url"); then
                jq -r '.projectStatus.conditions[]? | "| \(.metricKey) | \(.status) | \(.errorThreshold // "—") | \(.actualValue // "—") |"' <<< "$gate_payload"
              else
                echo "| Quality-gate details unavailable | — | — | — |"
              fi
            fi
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$QUALITY_GATE_STATUS" != "PASSED" ]; then
            echo "::error title=SonarQube Quality Gate ${result}::Review ${SONAR_DASHBOARD_URL}"
            exit 1
          fi
