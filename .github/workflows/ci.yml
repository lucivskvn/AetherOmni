name: DevSecOps CI Pipeline (Shift-Left & Cloud Security)

on:
  push:
    branches: [ current, main, master ]
  pull_request:
    branches: [ current, main, master ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fast-validation:
    name: Shift-Left Fast Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Hadolint Docker Security Scan
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          failure-threshold: ignore

      - name: Run Python Syntax & Import Validation
        run: |
          python -m py_compile $(git ls-files '*.py')

      - name: Verify Documentation & Version Alignment
        run: |
          python scripts/update_docs.py --ci || true

  cloud-security-scans:
    name: Cloud Deep Security (Semgrep & Snyk & CodeQL)
    runs-on: ubuntu-latest
    needs: fast-validation

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Run Semgrep Cloud Rules
        uses: semgrep/semgrep-action@v1
        with:
          config: p/default
        continue-on-error: true

      - name: Run Snyk Vulnerability & Dependency Scan
        uses: snyk/actions/python@master
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        continue-on-error: true
        with:
          args: --severity-threshold=high

  sonarqube-cloud-analysis:
    name: SonarQube Cloud SAST (https://sonarqube.fainko.cloud)
    runs-on: ubuntu-latest
    needs: fast-validation

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run SonarQube Scan against Coolify Cloud Instance
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: "https://sonarqube.fainko.cloud"
        with:
          args: >
            -Dsonar.scm.disabled=true
            -Dsonar.threads=4
        continue-on-error: true
