# ==============================================================================
# GITHUB ACTIONS CI PIPELINE — DUAL-LAYER SHIFT-LEFT & CLOUD QA GATE
# ==============================================================================
# Architecture:
#   Phase 1 ─ Pre-Scan          → Hadolint Dockerfile lint + ShellCheck
#                                  AST-Grep custom patterns + pip-audit supply chain
#                                  surreal validate SurrealQL schema
#   Phase 2 ─ Tests & Coverage  → ruff (linting) + eslint (linting)
#                                  bandit (Python SAST) + mypy (type checking)
#                                  Python tests → coverage.xml
#                                  JS tests     → coverage/js/lcov.info
#   Phase 3 ─ SonarCloud Gate   → Full cloud SAST + coverage ingestion + quality gate
#
# Note: Semgrep Cloud SAST is executed directly via Semgrep GitHub App.
#
# Required secrets: SONAR_TOKEN
# ==============================================================================
name: DevSecOps CI Pipeline

on:
  push:
    branches: [main, next]
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main, next]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================================================
  # Phase 1: Pre-Scan Validation & Security Audit
  # Fast infrastructure sanity check. Runs first so subsequent cloud scans
  # don't waste compute on obviously broken Dockerfiles or shell scripts.
  # ============================================================================
  pre-scan-validation:
    name: 1. Pre-Scan Validation & Security Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dockerfile & Script Validation (Hadolint)
        run: |
          if [[ -f Dockerfile ]]; then
            docker run --rm -i hadolint/hadolint@sha256:32dac94127fd60b7b7e3fbfc65e1383b9b5e25c9bfd7b8536de7a539fe68a12d hadolint - < Dockerfile
          fi
          if [[ -f scripts/verify-pipeline.sh ]]; then
            bash -n scripts/verify-pipeline.sh
          fi

      - name: ShellCheck Shell Script Audit
        run: |
          if command -v shellcheck &>/dev/null; then
            shellcheck run_checks.sh scripts/*.sh
          else
            sudo apt-get install -y --no-install-recommends shellcheck
            shellcheck run_checks.sh scripts/*.sh
          fi

      - name: AST-Grep Custom Pattern Scan
        run: |
          if ! command -v ast-grep &>/dev/null; then
            npm install -g --ignore-scripts @ast-grep/cli@0.45.1 --silent
          fi
          AST_OUTPUT=$(ast-grep scan --color never 2>&1)
          AST_ERRORS=$(echo "$AST_OUTPUT" | grep -c '^error' || true)
          if [[ "$AST_ERRORS" -gt 0 ]]; then
            echo "$AST_OUTPUT"
            echo "::error title=AST-Grep::$AST_ERRORS pattern error(s) found. Fix before merging."
            exit 1
          fi
          echo "AST-Grep scan: 0 errors"

      - name: Setup Python (for pip-audit and surreal validate)
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Supply Chain Audit (pip-audit)
        run: |
          pip install --no-cache-dir --only-binary :all: pip-audit==2.10.1 --quiet
          pip-audit -r requirements.txt

      - name: SurrealQL Schema Validation
        run: |
          if command -v surreal &>/dev/null; then
            SURQL_FILES=$(find . -name "*.surql" -not -path "./.git/*" -not -path "./.venv/*" | tr '\n' ' ')
            if [[ -n "$SURQL_FILES" ]]; then
              # shellcheck disable=SC2086
              surreal validate $SURQL_FILES
            fi
          else
            echo "::notice title=SurrealQL::surreal CLI not installed in runner. Install for local validation."
          fi

  # ============================================================================
  # Phase 2: Tests & Coverage Generation (PR Shift-Left Security Gate)
  # Runs linters for immediate developer feedback + all tests to generate
  # coverage artifacts consumed by SonarCloud in Phase 3.
  # ============================================================================
  tests-and-coverage:
    name: 2. PR Shift-Left Security Gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: pre-scan-validation
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-version.outputs.version }}
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Required for SonarCloud SCM blame data
          persist-credentials: false

      - name: Cache Dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.cache/pip
            ~/.npm
          key: ${{ runner.os }}-deps-${{ hashFiles('**/requirements.txt', '**/package-lock.json') }}
          restore-keys: ${{ runner.os }}-deps-

      - name: Compute Canonical Analysis Version
        id: release-version
        shell: bash
        run: |
          set -euo pipefail
          major_minor=$(tr -d '[:space:]' < VERSION)
          [[ "$major_minor" =~ ^[0-9]+\.[0-9]+$ ]]
          patch=$(git rev-list --count HEAD)
          version="${major_minor}.${patch}"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "### Analysis version: \`${version}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Setup Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: "npm"

      - name: Install Python Dependencies
        run: |
          pip install --no-cache-dir --only-binary :all: --upgrade pip==26.0.1
          pip install --no-cache-dir --only-binary :all: \
            bandit==1.9.4 \
            bleach==6.4.0 \
            coverage==7.15.4 \
            django==6.0.8 \
            django-storages[google]==1.14.6 \
            google-cloud-tasks==2.24.0 \
            google-genai==2.17.0 \
            gunicorn==26.0.0 \
            httpx==0.28.1 \
            markdown==3.10.3 \
            mypy==2.3.0 \
            protobuf==7.35.1 \
            psycopg[binary]==3.3.4 \
            python-dotenv==1.2.2 \
            pyyaml==6.0.3 \
            ruff==0.16.2 \
            sentry-sdk[django]==2.22.0 \
            sqlparse==0.5.5 \
            surrealdb==2.0.0 \
            whitenoise==6.12.0 --quiet

      - name: Install Node Dependencies
        run: |
          npm ci --prefer-offline --ignore-scripts

      - name: Python Lint (ruff)
        run: ruff check .

      - name: Code Quality & Cognitive Complexity Gate
        run: python scripts/check_code_quality.py

      - name: Bandit Python Security Audit
        run: python -m bandit -c bandit.yaml -r extractor/ core/ scripts/ -ll

      - name: Mypy Static Type Check
        run: python -m mypy --ignore-missing-imports core/ extractor/
        continue-on-error: true  # Non-blocking until stubs are complete; findings visible in annotations

      - name: Django Schema Migration Drift Gate
        run: python manage.py makemigrations --check --dry-run
        env:
          DJANGO_SECRET_KEY: "django-insecure-ci-test-key-50-chars-long-for-local-testing"
          SURREALDB_OFFLINE: "True"
          DATABASE_URL: "sqlite:///:memory:"

      - name: JavaScript Lint (eslint)
        run: ./node_modules/.bin/eslint --no-warn-ignored --max-warnings 0 "static/js/**/*.js"

      - name: Pulumi IaC Stack Gate
        run: |
          python -m ruff check infra/pulumi/
          python -m ruff format --check infra/pulumi/

      - name: Python Tests → coverage.xml
        run: |
          export DJANGO_SECRET_KEY="django-insecure-ci-test-key-50-chars-long-for-local-testing"
          python scripts/verify_templates_and_assets.py
          python manage.py collectstatic --noinput
          rm -f .coverage .coverage.* coverage.xml

          BATCH_DISPATCHER=$(python -c "
          import glob
          modules = [
              p.replace('/', '.').removesuffix('.py')
              for p in sorted(glob.glob('core/tests/**/test_*.py', recursive=True) + glob.glob('extractor/tests/**/test_*.py', recursive=True))
              if not p.endswith('__init__.py')
          ]
          view_mods = [m for m in modules if 'test_views' in m]
          non_view_mods = [m for m in modules if 'test_views' not in m]
          chunk_size = 10
          batches = [non_view_mods[i:i+chunk_size] for i in range(0, len(non_view_mods), chunk_size)]
          if view_mods:
              batches.append(view_mods)
          for b in batches:
              print(' '.join(b))
          ")

          while IFS= read -r BATCH_MODULES; do
              [[ -z "$BATCH_MODULES" ]] && continue
              coverage run -p manage.py test $BATCH_MODULES --keepdb --buffer
          done <<< "$BATCH_DISPATCHER"

          coverage combine
          coverage xml -o coverage.xml
        env:
          SURREALDB_OFFLINE: "True"
          DATABASE_URL: "sqlite:///:memory:"
          MALLOC_ARENA_MAX: "2"

      - name: JavaScript Tests → coverage/js/lcov.info
        run: |
          npm run test:coverage

  # ============================================================================
  # Phase 3: SonarCloud Quality Gate (Cloud SAST + Coverage + Gate Enforcement)
  # Downloads coverage from Phase 2, runs full SonarCloud analysis, then polls
  # the quality gate and fails the pipeline if it doesn't pass.
  # ============================================================================
  sonarcloud-quality-gate:
    name: 3. SonarCloud Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: tests-and-coverage
    if: |
      github.actor != 'dependabot[bot]' &&
      (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository)
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Validate SONAR_TOKEN
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          set -euo pipefail
          if [[ -z "${SONAR_TOKEN:-}" ]]; then
            echo "::error title=Missing SONAR_TOKEN::Generate a User Token at https://sonarcloud.io/account/security and store it as the SONAR_TOKEN repository secret."
            exit 1
          fi
          resp=$(curl --silent --show-error --user "${SONAR_TOKEN}:" "https://sonarcloud.io/api/authentication/validate" || true)
          is_valid=$(echo "$resp" | jq -r '.valid // false')
          if [[ "$is_valid" != "true" ]]; then
            echo "::error title=Invalid SONAR_TOKEN::Token rejected by SonarCloud (response: ${resp}). Regenerate at https://sonarcloud.io/account/security"
            exit 1
          fi
          echo "SONAR_TOKEN validated (valid=true)"

      - name: Fetch and Verify SonarCloud Quality Gate
        id: quality-gate
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PROJECT_KEY: lucivskvn_AetherOmni
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_DASHBOARD_URL: https://sonarcloud.io/summary/new_code?id=lucivskvn_AetherOmni
          SONAR_PULL_REQUEST: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail

          quality_gate_url="${SONAR_HOST_URL}/api/qualitygates/project_status?projectKey=${SONAR_PROJECT_KEY}"
          if [ -n "$SONAR_PULL_REQUEST" ]; then
            quality_gate_url="${quality_gate_url}&pullRequest=${SONAR_PULL_REQUEST}"
          fi
          echo "Querying SonarCloud Quality Gate from: ${quality_gate_url}"
          gate_payload=$(curl --fail --silent --show-error --user "${SONAR_TOKEN}:" "$quality_gate_url")
          status=$(echo "$gate_payload" | jq -r '.projectStatus.status // "UNAVAILABLE"')
          echo "quality-gate-status=${status}" >> "$GITHUB_OUTPUT"
          echo "SonarCloud Quality Gate Status: ${status}"

          summary_file="${RUNNER_TEMP}/sonarcloud-quality-gate.md"
          {
            echo "### SonarCloud Quality Gate: ${status}"
            echo
            echo "| Status | Dashboard |"
            echo "| --- | --- |"
            echo "| ${status} | [Open SonarCloud dashboard](${SONAR_DASHBOARD_URL}) |"
            echo
            echo "| Metric | Status | Threshold | Actual |"
            echo "| --- | --- | --- | --- |"
            jq -r '.projectStatus.conditions[]? | "| \(.metricKey) | \(.status) | \(.errorThreshold // "—") | \(.actualValue // "—") |"' <<< "$gate_payload"
          } | tee "$summary_file"
          cat "$summary_file" >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" != "OK" ]; then
            jq -r '
              .projectStatus.conditions[]?
              | select(.status != "OK")
              | "::error title=SonarCloud \(.metricKey)::Threshold \(.errorThreshold // "not reported"), actual \(.actualValue // "not reported")"
            ' <<< "$gate_payload"
            echo "::error title=SonarCloud Quality Gate ${status}::Quality Gate failed. Review ${SONAR_DASHBOARD_URL}"
            exit 1
          fi
