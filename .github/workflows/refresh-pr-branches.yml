name: Refresh protected PR branches

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Optional same-repository PR number to refresh; leave blank to refresh all eligible PRs.
        required: false
        type: string

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-branch-refresh
  cancel-in-progress: false

jobs:
  refresh:
    name: Refresh eligible PR branches
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.PR_AUTOMATION_TOKEN }}
      REPOSITORY: ${{ github.repository }}
      TARGET_PR: ${{ inputs.pr_number }}
    steps:
      - name: Require dedicated automation token
        run: |
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error title=Missing PR automation token::Configure PR_AUTOMATION_TOKEN with contents:write and pull-requests:write access."
            exit 1
          fi

      - name: Update same-repository branches
        shell: bash
        run: |
          set -euo pipefail

          api() {
            curl --fail-with-body --silent --show-error --retry 3 --retry-all-errors \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" "$@"
          }

          if [ -n "${TARGET_PR}" ]; then
            api "https://api.github.com/repos/${REPOSITORY}/pulls/${TARGET_PR}" \
              | jq -r --arg repo "${REPOSITORY}" '
                  select(.state == "open" and (.draft | not) and .base.ref == "main" and .head.repo.full_name == $repo)
                  | [.number, .head.sha] | @tsv
                ' > prs.tsv
          else
            api "https://api.github.com/repos/${REPOSITORY}/pulls?state=open&base=main&per_page=100" \
              | jq -r --arg repo "${REPOSITORY}" '
                  .[]
                  | select((.draft | not) and .head.repo.full_name == $repo)
                  | [.number, .head.sha] | @tsv
                ' > prs.tsv
          fi

          while IFS=$'\t' read -r number head_sha; do
            [ -n "${number}" ] || continue
            echo "Refreshing PR #${number}"
            status=$(curl --silent --show-error --output response.json --write-out "%{http_code}" \
              --request PUT \
              --header "Accept: application/vnd.github+json" \
              --header "Authorization: Bearer ${GH_TOKEN}" \
              --header "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPOSITORY}/pulls/${number}/update-branch" \
              --data "{\"expected_head_sha\": \"${head_sha}\"}")

            case "${status}" in
              202) echo "PR #${number} refresh accepted." ;;
              422) echo "PR #${number} needs no refresh or has a merge conflict: $(jq -r '.message // "unknown response"' response.json)" ;;
              *) cat response.json; exit 1 ;;
            esac
          done < prs.tsv
