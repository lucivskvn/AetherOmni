name: Auto-Update Documentation & Version

on:
  push:
    branches:
      - current
      - main
    paths-ignore:
      # Prevent infinite loop — these files are written by this workflow itself
      - "README.md"
      - "gcp_deployment_guide.md"
      - "service.yaml"
      - "service-worker.yaml"
      - ".github/workflows/update_docs.yml"

  # Allow manual trigger from GitHub UI or API
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Job 1: Compute the canonical version from git and export it as an output
  # ──────────────────────────────────────────────────────────────────────────────
  compute-version:
    name: Compute Version
    runs-on: ubuntu-latest

    outputs:
      semver: ${{ steps.version.outputs.semver }}
      release_ver: ${{ steps.version.outputs.release_ver }}
      badge_ver: ${{ steps.version.outputs.badge_ver }}
      sha: ${{ steps.version.outputs.sha }}
      today: ${{ steps.version.outputs.today }}

    steps:
      - name: Checkout (full history for commit count)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compute version from git
        id: version
        run: |
          # Run the script in --print-version mode to get the semver
          SEMVER=$(python scripts/update_docs.py --print-version)
          RELEASE_VER=$(python scripts/update_docs.py --print-release)
          SHA=$(git rev-parse --short HEAD)
          TODAY=$(date -u +%Y-%m-%d)
          BADGE_VER="v${SEMVER}"

          echo "semver=${SEMVER}"         >> "$GITHUB_OUTPUT"
          echo "release_ver=${RELEASE_VER}" >> "$GITHUB_OUTPUT"
          echo "badge_ver=${BADGE_VER}"   >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}"               >> "$GITHUB_OUTPUT"
          echo "today=${TODAY}"           >> "$GITHUB_OUTPUT"

          echo "=== Version computed ==="
          echo "  Semver      : ${SEMVER}"
          echo "  Release ver : ${RELEASE_VER}"
          echo "  SHA         : ${SHA}"
          echo "  Today       : ${TODAY}"

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 2: Refresh docs with the computed version + commit back to the branch
  # ──────────────────────────────────────────────────────────────────────────────
  update-docs:
    name: Refresh Docs — ${{ needs.compute-version.outputs.release_ver }}
    runs-on: ubuntu-latest
    needs: compute-version

    permissions:
      contents: write

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # ── Optional: count unit tests ─────────────────────────────────────────
      - name: Count unit tests (best effort)
        run: |
          pip install django==6.0.7 python-dotenv==1.2.2 --quiet 2>/dev/null
          COUNT=$(python -m django test extractor --list \
            --settings=core.settings \
            2>/dev/null | grep -c "^extractor\." || echo "")
          if [ -n "$COUNT" ] && [ "$COUNT" -gt 0 ]; then
            echo "$COUNT" > .test_count
            echo "Test count cached: $COUNT"
          fi
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SURREALDB_OFFLINE: "True"
          DJANGO_SECRET_KEY: "ci-dummy-key"
          DJANGO_SETTINGS_MODULE: "core.settings"
        continue-on-error: true

      # ── Run the updater ────────────────────────────────────────────────────
      - name: Run documentation updater
        run: python scripts/update_docs.py --ci

      # ── Check and commit ───────────────────────────────────────────────────
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            git diff --name-only
          fi

      - name: Commit updated docs back to branch
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md gcp_deployment_guide.md service.yaml service-worker.yaml .test_count || true
          git commit -m "docs: set version ${{ needs.compute-version.outputs.release_ver }} [skip ci]"
          git push

      - name: Summary
        run: |
          echo "### 📦 Version: ${{ needs.compute-version.outputs.release_ver }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Field | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|---|---|" >> $GITHUB_STEP_SUMMARY
          echo "| Semver | \`${{ needs.compute-version.outputs.semver }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Release Version | \`${{ needs.compute-version.outputs.release_ver }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Commit SHA | \`${{ needs.compute-version.outputs.sha }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Date | ${{ needs.compute-version.outputs.today }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docs updated | ${{ steps.diff.outputs.changed }} |" >> $GITHUB_STEP_SUMMARY
