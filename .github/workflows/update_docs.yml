---
name: Auto-Update Documentation & Version

'on':
  workflow_dispatch:
    # Manual run only to avoid automatic docs-version auto-commits on main.
    # This prevents repeated merge/rebase churn when the workflow updates
    # dynamic badges and metadata on the default branch.
    inputs:
      run_description:
        description: 'Optional note for manual docs sync run'
        required: false
        default: 'Manual docs sync'

permissions:
  contents: read

jobs:
  # ──────────────────────────────────────────────────────────────────────────────
  # Job 1: Compute the canonical version from git and export it as an output
  # ──────────────────────────────────────────────────────────────────────────────
  compute-version:
    name: Compute Version
    runs-on: ubuntu-latest
    permissions:
      contents: read

    outputs:
      semver: ${{ steps.version.outputs.semver }}
      release_ver: ${{ steps.version.outputs.release_ver }}
      badge_ver: ${{ steps.version.outputs.badge_ver }}
      sha: ${{ steps.version.outputs.sha }}
      today: ${{ steps.version.outputs.today }}

    steps:
      - name: Checkout (full history for commit count)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"


      - name: Compute version from git
        id: version
        run: |
          # Run the script in --print-version mode to get the semver
          SEMVER=$(python scripts/update_docs.py --print-version)
          RELEASE_VER=$(python scripts/update_docs.py --print-release)
          SHA=$(git rev-parse --short HEAD)
          TODAY=$(date -u +%Y-%m-%d)
          BADGE_VER="v${SEMVER}"

          echo "semver=${SEMVER}"         >> "$GITHUB_OUTPUT"
          echo "release_ver=${RELEASE_VER}" >> "$GITHUB_OUTPUT"
          echo "badge_ver=${BADGE_VER}"   >> "$GITHUB_OUTPUT"
          echo "sha=${SHA}"               >> "$GITHUB_OUTPUT"
          echo "today=${TODAY}"           >> "$GITHUB_OUTPUT"

          echo "=== Version computed ==="
          echo "  Semver      : ${SEMVER}"
          echo "  Release ver : ${RELEASE_VER}"
          echo "  SHA         : ${SHA}"
          echo "  Today       : ${TODAY}"

  # ──────────────────────────────────────────────────────────────────────────────
  # Job 2: Refresh docs locally and report whether the manual run found drift
  # ──────────────────────────────────────────────────────────────────────────────
  update-docs:
    name: Refresh Docs — ${{ needs.compute-version.outputs.release_ver }}
    runs-on: ubuntu-latest
    needs: compute-version

    permissions:
      contents: read

    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.14"


      # ── Optional: count unit tests ─────────────────────────────────────────
      - name: Count unit tests (best effort)
        run: |
          set -eo pipefail
          rm -f .test_count
          COUNT=$(python - <<'PY'
          import ast
          from pathlib import Path

          count = 0
          for path in Path("extractor/tests").glob("test*.py"):
              tree = ast.parse(path.read_text(encoding="utf-8"), filename=str(path))
              count += sum(
                  isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)) and node.name.startswith("test_")
                  for node in ast.walk(tree)
              )
          print(count)
          PY
          )
          if [ -n "$COUNT" ] && [ "$COUNT" -gt 0 ]; then
            echo "$COUNT" > .test_count
            echo "Test count cached: $COUNT"
          fi
        env:
          DATABASE_URL: "sqlite:///:memory:"
          SURREALDB_OFFLINE: true
          DJANGO_SECRET_KEY: "ci-dummy-key"
          DJANGO_SETTINGS_MODULE: "core.settings"
        continue-on-error: true

      # ── Run the updater ────────────────────────────────────────────────────
      - name: Run documentation updater
        run: python scripts/update_docs.py --ci

      # ── Check and commit ───────────────────────────────────────────────────
      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changed files:"
            git diff --name-only
          fi

      - name: Summary
        env:
          RELEASE_VER: ${{ needs.compute-version.outputs.release_ver }}
          SEMVER: ${{ needs.compute-version.outputs.semver }}
          COMMIT_SHA: ${{ needs.compute-version.outputs.sha }}
          TODAY: ${{ needs.compute-version.outputs.today }}
          DOCS_UPDATED: ${{ steps.diff.outputs.changed }}
        run: |
          echo "### 📦 Version: ${RELEASE_VER}" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Field | Value |" >> "$GITHUB_STEP_SUMMARY"
          echo "|---|---|" >> "$GITHUB_STEP_SUMMARY"
          semver_line="| Semver | \\`${SEMVER}\\` |"
          echo "$semver_line" >> "$GITHUB_STEP_SUMMARY"
          release_line="| Release Version | \\`${RELEASE_VER}\\` |"
          echo "$release_line" >> "$GITHUB_STEP_SUMMARY"
          sha_line="| Commit SHA | \\`${COMMIT_SHA}\\` |"
          echo "$sha_line" >> "$GITHUB_STEP_SUMMARY"
          echo "| Date | ${TODAY} |" >> "$GITHUB_STEP_SUMMARY"
          echo "| Docs updated | ${DOCS_UPDATED} |" >> "$GITHUB_STEP_SUMMARY"
