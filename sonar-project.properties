sonar.projectKey=aetheromni
sonar.projectName=AetherOmni
# Version is kept in sync with scripts/update_docs.py (MAJOR.MINOR from VERSION file).
# Update this when the major.minor version changes.
sonar.projectVersion=1.2

sonar.sources=core, extractor, manage.py
sonar.tests=extractor/tests
sonar.exclusions=**/__pycache__/**,**/*.pyc,extractor/tests/**,**/migrations/**,**/static_root/**,**/static/admin/**,**/media/**,**/tests.py,venv/**,.git/**,.github/**,.agents/**,Sources/**,db.sqlite3,sbom.json,skills-lock.json,verification/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.ico

sonar.language=py
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Coverage report integration
sonar.python.coverage.reportPaths=coverage.xml

# Enable fast incremental analysis caching
sonar.analysis.cache.enabled=true
