sonar.organization=esbpcs
sonar.projectKey=lucivskvn_AetherOmni
sonar.projectName=AetherOmni
# sonar.projectVersion is supplied dynamically by the CI workflow per commit.

# ---------------------------------------------------------------------------
# Source & Test Separation
# sonar.sources points to the root; sonar.test.inclusions explicitly marks
# test files so SonarCloud applies test-code rules rather than production rules.
# sonar.tests must match sonar.test.inclusions directory for coverage mapping.
# ---------------------------------------------------------------------------
sonar.sources=.
sonar.tests=extractor/tests
sonar.test.inclusions=extractor/tests/**/*.py

sonar.exclusions=\
  Dockerfile,\
  **/__pycache__/**,\
  **/*.pyc,\
  extractor/tests/**,\
  **/migrations/**,\
  **/static_root/**,\
  **/static/admin/**,\
  **/media/**,\
  **/tests.py,\
  venv/**,\
  .git/**,\
  .github/**,\
  .agents/**,\
  Sources/**,\
  db.sqlite3,\
  sbom.json,\
  skills-lock.json,\
  uv.lock,\
  pyproject.toml,\
  verification/**,\
  **/*.png,\
  **/*.jpg,\
  **/*.jpeg,\
  **/*.ico,\
  **/*.surql,\
  infra/gcp/**,\
  coverage/**

sonar.coverage.exclusions=\
  static/**,\
  scripts/**,\
  manage.py,\
  infra/**,\
  docs/**,\
  fix_editor.py,\
  reconstruct_editor.py

sonar.cpd.exclusions=\
  **/templates/**/*.html,\
  extractor/templates/extractor/login.html,\
  extractor/templates/extractor/register.html,\
  extractor/templates/extractor/forgot_password.html,\
  extractor/templates/extractor/reset_password_confirm.html,\
  extractor/templates/extractor/password_change.html

# ---------------------------------------------------------------------------
# Language & Encoding
# sonar.python.version targets Python 3.14 for SonarCloud static analysis.
# ---------------------------------------------------------------------------
sonar.python.version=3.14
sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# ---------------------------------------------------------------------------
# Coverage & Performance
# ---------------------------------------------------------------------------
# JavaScript coverage: LCOV report generated by Vitest + @vitest/coverage-v8
# Run: npm run test:coverage
sonar.javascript.lcov.reportPaths=coverage/js/lcov.info
sonar.python.coverage.reportPaths=coverage.xml
sonar.analysis.cache.enabled=true
