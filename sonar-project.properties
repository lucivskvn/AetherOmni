sonar.projectKey=aetheromni
sonar.projectName=AetherOmni
# Version is kept in sync with scripts/update_docs.py (MAJOR.MINOR from VERSION file).
sonar.projectVersion=1.5.479

sonar.sources=.
sonar.tests=extractor/tests
sonar.exclusions=Dockerfile,**/__pycache__/**,**/*.pyc,extractor/tests/**,**/migrations/**,**/static_root/**,**/static/admin/**,**/media/**,**/tests.py,venv/**,.git/**,.github/**,.agents/**,Sources/**,db.sqlite3,sbom.json,skills-lock.json,verification/**,**/*.png,**/*.jpg,**/*.jpeg,**/*.ico
sonar.coverage.exclusions=static/js/**,scripts/**,fix_editor.py,reconstruct_editor.py
sonar.cpd.exclusions=extractor/templates/extractor/login.html,extractor/templates/extractor/register.html,extractor/templates/extractor/forgot_password.html,extractor/templates/extractor/reset_password_confirm.html,extractor/templates/extractor/password_change.html

# Multi-language: Python 3.13 + JavaScript (ESLint 10 conventions)
sonar.python.version=3.13


sonar.sourceEncoding=UTF-8
sonar.scm.provider=git

# Quality Gate & Security Analysis (SonarQube 2026 MQR)
sonar.python.coverage.reportPaths=coverage.xml
sonar.qualitygate.wait=true

# Fast incremental analysis caching
sonar.analysis.cache.enabled=true
