# SonarQube Project Configuration
# Document: https://docs.sonarqube.org/latest/analysis/analysis-parameters/

sonar.projectKey=aetheromni
sonar.projectName=AetherOmni
sonar.projectVersion=2.0

# Path to the source directories
sonar.sources=core, extractor, manage.py

# Language specifications
sonar.language=py
sonar.python.version=3.12
sonar.sourceEncoding=UTF-8

# SCM specifications
sonar.scm.disabled=true

# Excluded paths from analysis (optimizing scan speeds and preventing database/binary scans)
sonar.exclusions=extractor/tests/**, **/migrations/**, **/static_root/**, **/static/admin/**, **/media/**, **/tests.py, venv/**, .git/**, .github/**, .agents/**, Sources/**, db.sqlite3, sbom.json, skills-lock.json

# Test configurations
sonar.tests=extractor/tests
sonar.python.coverage.reportPaths=coverage.xml
