# SonarCloud Automatic Analysis ignores sonar-project.properties. Keep these
# supported properties aligned with the repository's runtime and test layout.
sonar.sources=.
sonar.tests=extractor/tests,core/tests
sonar.test.inclusions=extractor/tests/**/*.py,core/tests/**/*.py
sonar.python.version=3.14
sonar.sourceEncoding=UTF-8
