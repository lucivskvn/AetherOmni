id: py-no-hardcoded-secret
message: "Potential hardcoded secret. Use environment variables or Secret Manager instead."
severity: error
language: Python
rule:
  any:
    - pattern: password = "$VAL"
    - pattern: api_key = "$VAL"
    - pattern: secret = "$VAL"
    - pattern: PASSWORD = "$VAL"
    - pattern: API_KEY = "$VAL"
    - pattern: SECRET = "$VAL"
