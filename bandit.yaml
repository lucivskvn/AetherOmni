---
# Bandit Security Scanner Configuration File
# -------------------------------------------
# Mapped to SOC 2 (CC7.1, CC7.2) and ISO 27001 (A.12.6.1, A.14.2.1) Compliance.

# Exclude unit tests from the vulnerability assessment.
# Reason: Unit tests use dummy credentials (e.g., password="password123") and local test
# frameworks that trigger false-positive B106 (hardcoded password) and other mock-related warnings.
# Audited production code is scanned separately to verify zero real vulnerabilities.
exclude_dirs:
  - 'extractor/tests'
