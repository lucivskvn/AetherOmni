---
# Bandit Security Scanner Configuration File
# -------------------------------------------
# Mapped to SOC 2 (CC7.1, CC7.2) and ISO 27001
# (A.12.6.1, A.14.2.1) compliance.

# Exclude unit tests from the vulnerability assessment.
# Reason: Unit tests use dummy credentials (e.g., password="password123") and
# local test frameworks can trigger false-positive B106 and mock-related
# warnings. Audited production code is scanned separately to verify zero real
# vulnerabilities.
exclude_dirs:
  - 'extractor/tests'
