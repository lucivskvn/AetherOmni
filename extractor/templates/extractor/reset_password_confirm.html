{% extends 'extractor/base.html' %}

{% block title %}Confirm Password Reset{% endblock %}

{% block extra_css %}
<style>
    /* Premium Centered Confirm Container */
    .confirm-container {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: calc(100vh - 180px);
        padding: 24px;
        position: relative;
    }

    /* Jaw-Dropping Glassmorphic Confirm Card */
    .confirm-card {
        width: 100%;
        max-width: 440px;
        padding: 40px;
        background: rgba(15, 23, 42, 0.55);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 24px;
        box-shadow: 0 20px 50px rgba(0, 0, 0, 0.4);
        position: relative;
        overflow: hidden;
        animation: card-appear 0.6s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes card-appear {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }

    .confirm-card::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 60%);
        pointer-events: none;
    }

    .confirm-header {
        text-align: center;
        margin-bottom: 32px;
    }

    .confirm-logo-glow {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 64px;
        height: 64px;
        border-radius: 16px;
        background: rgba(99, 102, 241, 0.15);
        border: 1px solid rgba(99, 102, 241, 0.3);
        color: var(--primary);
        margin-bottom: 16px;
        box-shadow: 0 0 20px rgba(99, 102, 241, 0.25);
    }

    .confirm-header h2 {
        font-family: var(--font-display);
        font-size: 26px;
        font-weight: 800;
        letter-spacing: -0.025em;
        background: linear-gradient(135deg, #fff 40%, var(--text-muted) 100%);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        margin-bottom: 6px;
    }

    .confirm-header p {
        color: var(--text-muted);
        font-size: 14px;
        font-weight: 500;
    }

    .form-group {
        margin-bottom: 24px;
        display: flex;
        flex-direction: column;
        gap: 8px;
    }

    .form-group label {
        font-size: 13px;
        font-weight: 600;
        color: var(--text-main);
        letter-spacing: 0.05em;
        text-transform: uppercase;
    }

    .confirm-input {
        width: 100%;
        padding: 12px 16px;
        background: rgba(3, 7, 18, 0.6);
        border: 1px solid rgba(255, 255, 255, 0.1);
        border-radius: 10px;
        color: var(--text-main);
        font-size: 16px;
        font-family: var(--font-body);
        transition: var(--transition-smooth);
        outline: none;
    }

    .confirm-input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        background: rgba(3, 7, 18, 0.85);
    }

    .btn-confirm-submit {
        width: 100%;
        padding: 14px;
        border-radius: 10px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--secondary) 100%);
        border: none;
        color: white;
        font-size: 15px;
        font-weight: 700;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        box-shadow: 0 4px 15px rgba(99, 102, 241, 0.35);
        transition: var(--transition-smooth);
        font-family: var(--font-body);
    }

    .btn-confirm-submit:focus-visible {
        outline: 2px solid var(--primary);
        outline-offset: 2px;
        border-radius: 10px;
    }

    .btn-confirm-submit:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 20px rgba(99, 102, 241, 0.5);
        filter: brightness(1.1);
    }

    .confirm-errors {
        background: #2a0b0e;
        border: 1px solid #7f1d1d;
        border-radius: 10px;
        padding: 12px 16px;
        margin-bottom: 24px;
        color: #fee2e2;
        font-size: 14px;
        font-weight: 500;
        display: none;
    }
</style>
{% endblock %}

{% block content %}
<div class="confirm-container" data-supabase-url="{{ supabase_url }}" data-supabase-key="{{ supabase_key }}">
    <div class="confirm-card">
        <div class="confirm-header">
            <div class="confirm-logo-glow" aria-hidden="true">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                    <path d="M12 18v-3"/>
                </svg>
            </div>
            <h2>New Password</h2>
            <p>Set a new password for your account</p>
        </div>

        <div id="confirm-error" class="confirm-errors" role="alert"></div>

        <form id="confirm-reset-form">
            <div class="form-group">
                <label for="new_password">New Password <span class="text-danger" aria-hidden="true">*</span></label>
                <input type="password" id="new_password" name="password" class="confirm-input" autocomplete="new-password" required autofocus placeholder="Enter new password" aria-required="true">
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm New Password <span class="text-danger" aria-hidden="true">*</span></label>
                <input type="password" id="confirm_password" name="confirm_password" class="confirm-input" autocomplete="new-password" required placeholder="Confirm new password" aria-required="true">
            </div>

            <button type="submit" class="btn-confirm-submit" aria-label="Update Password">
                <i data-lucide="key-round"></i> Update Password
            </button>
        </form>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    document.addEventListener('DOMContentLoaded', () => {
        const form = document.getElementById('confirm-reset-form');
        const errorDiv = document.getElementById('confirm-error');

        // Check if we have the recovery token saved in sessionStorage
        const token = sessionStorage.getItem('supabase_recovery_token');
        if (!token) {
            errorDiv.textContent = "Recovery session token is missing. Please request a new link.";
            errorDiv.style.display = 'block';
            form.querySelector('button').disabled = true;
            return;
        }

        const submitBtn = form.querySelector('button[type="submit"]');
        const restoreSubmitButton = () => {
            if (!submitBtn) return;

            submitBtn.replaceChildren();
            const icon = document.createElement('i');
            icon.dataset.lucide = 'key-round';
            submitBtn.append(icon, document.createTextNode(' Update Password'));
            if (typeof lucide !== 'undefined') {
                lucide.createIcons();
            }
            submitBtn.style.pointerEvents = 'auto';
            submitBtn.style.opacity = '1';
        };

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            errorDiv.style.display = 'none';

            const newPassword = document.getElementById('new_password').value;
            const confirmPassword = document.getElementById('confirm_password').value;

            if (newPassword !== confirmPassword) {
                errorDiv.textContent = "Passwords do not match.";
                errorDiv.style.display = 'block';
                restoreSubmitButton();
                return;
            }

            if (newPassword.length < 6) {
                errorDiv.textContent = "Password must be at least 6 characters.";
                errorDiv.style.display = 'block';
                restoreSubmitButton();
                return;
            }

            // This form submits through fetch(), so it opts into the shared spinner after validation.
            if (typeof setFormSubmitLoadingState === 'function') {
                setFormSubmitLoadingState(form);
            }

            const container = document.querySelector('.confirm-container');
            const supabaseUrl = container.dataset.supabaseUrl;
            const supabaseKey = container.dataset.supabaseKey;

            if (!supabaseUrl || !supabaseKey) {
                errorDiv.textContent = "Supabase integration is not configured.";
                errorDiv.style.display = 'block';
                // Reset submit button state
                restoreSubmitButton();
                return;
            }

            // Put call to Supabase API to update user password
            const url = `${supabaseUrl.replace(/\/$/, '')}/auth/v1/user`;
            
            fetch(url, {
                method: 'PUT',
                headers: {
                    'apikey': supabaseKey,
                    'Authorization': `Bearer ${token}`,
                    'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                    password: newPassword
                })
            })
            .then(res => {
                if (!res.ok) {
                    return res.json().then(err => {
                        throw new Error(err.msg || err.error_description || 'Update failed');
                    });
                }
                return res.json();
            })
            .then(data => {
                // Clear the recovery token
                sessionStorage.removeItem('supabase_recovery_token');
                
                // Redirect back to login with success indicator
                // We'll use a query param so login view can show a success message
                globalThis.location.href = "{% url 'login' %}?reset_success=1";
            })
            .catch(err => {
                errorDiv.textContent = `Error: ${err.message}`;
                errorDiv.style.display = 'block';
                // Reset submit button state
                restoreSubmitButton();
            });
        });
    });
</script>
{% endblock %}
