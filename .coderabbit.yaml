# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "en-US"
tone_instructions: "Be concise, analytical, and provide direct, tested diffs adhering to Python 3.14, ESLint 10, and SurrealDB v3 standards."
early_access: false

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: true
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "next"

chat:
  auto_reply: true

knowledge_base:
  opt_out: false
  learnings:
    scope: "repository"
