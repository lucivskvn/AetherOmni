steps:
  # 0. Compute the canonical version from git metadata
  #    VERSION file holds MAJOR.MINOR; PATCH is auto-incremented from commit count.
  #    Result: SEMVER = "1.2.107"  |  RELEASE_VERSION = "v1.2.107+abc1234"
  #    Both are written to /workspace/build_env.sh and sourced by later steps.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e

        # Read MAJOR.MINOR from the VERSION file (only human-bumped part)
        MAJOR_MINOR=$$(cat VERSION | tr -d '[:space:]' | grep -oP '^\d+\.\d+' || echo "0.1")

        # PATCH = total commit count in history (auto-increments every merged commit)
        # git is available in this image when Cloud Build clones from GitHub trigger.
        # For manual `gcloud builds submit` (tarball source), git rev-list may fail;
        # we fall back to the SHORT_SHA substitution prefix as a deterministic patch.
        PATCH=$$(git rev-list --count HEAD 2>/dev/null || echo "")
        if [ -z "$$PATCH" ] || ! echo "$$PATCH" | grep -qE '^[0-9]+$' ; then
          # Fallback: derive numeric patch from first 4 hex chars of SHORT_SHA/BUILD_ID
          HEX_PART=$$(echo "${SHORT_SHA:-${BUILD_ID}}" | cut -c1-4)
          PATCH=$$(printf '%d' "0x$$HEX_PART" 2>/dev/null || echo "0")
        fi

        SEMVER="$${MAJOR_MINOR}.$${PATCH}"

        # SHORT_SHA is populated by Cloud Build GitHub trigger; fallback to BUILD_ID prefix
        SHA_VAL="${SHORT_SHA}"
        if [ -z "$$SHA_VAL" ]; then
          SHA_VAL=$$(echo "${BUILD_ID}" | cut -c1-7)
        fi

        RELEASE_VERSION="v$${SEMVER}+$${SHA_VAL}"

        echo "=== AetherOmni Version Computation ==="
        echo "  MAJOR.MINOR    : $${MAJOR_MINOR}"
        echo "  PATCH (commits): $${PATCH}"
        echo "  SEMVER         : $${SEMVER}"
        echo "  SHA            : $${SHA_VAL}"
        echo "  RELEASE_VERSION: $${RELEASE_VERSION}"
        echo "======================================"

        # Write to shared workspace file so all subsequent steps can source it
        cat > /workspace/build_env.sh << EOF
        export SEMVER="$${SEMVER}"
        export RELEASE_VERSION="$${RELEASE_VERSION}"
        export SHA="$${SHA_VAL}"
        EOF

        echo "Build environment written to /workspace/build_env.sh"
    id: 'compute-version'

  # 1. Ensure the Artifact Registry repository exists (idempotent)
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        gcloud artifacts repositories describe $_AR_REPO \
          --location=$_REGION \
          --project=$PROJECT_ID \
          --quiet 2>/dev/null || \
        gcloud artifacts repositories create $_AR_REPO \
          --repository-format=docker \
          --location=$_REGION \
          --project=$PROJECT_ID \
          --description="AetherOmni container images"
        echo "Artifact Registry repository '$_AR_REPO' is ready."
    id: 'ensure-repo'
    waitFor: ['compute-version']

  # 2. Pull the previous image for Docker layer caching
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        docker pull $_IMAGE:latest || exit 0
    id: 'pull'
    waitFor: ['ensure-repo']

  # 3. Build the container image with the semantic version as a build arg
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/build_env.sh
        export DOCKER_BUILDKIT=1
        docker build \
          --cache-from "$_IMAGE:latest" \
          --build-arg BUILDKIT_INLINE_CACHE=1 \
          --build-arg RELEASE_VERSION="$${RELEASE_VERSION}" \
          -t "$_IMAGE:latest" \
          -t "$_IMAGE:$${SEMVER}" \
          -t "$_IMAGE:$BUILD_ID" \
          .
    id: 'build'
    waitFor: ['pull']

  # 4. Push all image tags to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/build_env.sh
        docker push "$_IMAGE:latest"
        docker push "$_IMAGE:$${SEMVER}"
        docker push "$_IMAGE:$BUILD_ID"
    id: 'push'
    waitFor: ['build']

  # 5. Prepare service YAMLs -- inject dynamic image tag + RELEASE_VERSION
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/build_env.sh
        set -e

        # Pin image to the specific build ID (immutable, traceable)
        sed -i "s|aether-web:latest|aether-web:$BUILD_ID|g" service.yaml
        sed -i "s|aether-web:latest|aether-web:$BUILD_ID|g" service-worker.yaml

        # Inject the semantic RELEASE_VERSION
        python3 - << 'PYEOF'
        import re, sys, os

        release_ver = os.environ.get("RELEASE_VERSION", "unknown")
        for fname in ("service.yaml", "service-worker.yaml"):
            with open(fname, "r") as f:
                text = f.read()
            # Replace RELEASE_VERSION value -- robust to any prior value format
            text = re.sub(
                r'(- name: RELEASE_VERSION\s+value:\s+")[^"]*(")',
                lambda m: m.group(1) + release_ver + m.group(2),
                text,
                flags=re.MULTILINE,
            )
            with open(fname, "w") as f:
                f.write(text)
            print(f"[OK] {fname}: RELEASE_VERSION -> {release_ver}")
        PYEOF

        echo ""
        echo "=== Version injected into service YAMLs ==="
        grep "RELEASE_VERSION" service.yaml service-worker.yaml
    id: 'prepare-yaml'
    waitFor: ['push']

  # 6. Inject APP_URL and WORKER_URL after deploying (requires knowing the Cloud Run URLs)
  #    We derive them from the service name + project hash that Cloud Run generates.
  #    If this is a first-time deploy, the URLs will be set in a post-deploy patch step.
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        set -e
        # Resolve the stable Cloud Run URLs for both services (they contain the project hash)
        # gcloud returns empty string if the service doesn't exist yet (first deploy)
        WEB_URL=$$(gcloud run services describe $_WEB_SERVICE \
          --region=$_REGION --project=$PROJECT_ID \
          --format="value(status.url)" 2>/dev/null || echo "")
        WORKER_URL=$$(gcloud run services describe $_WORKER_SERVICE \
          --region=$_REGION --project=$PROJECT_ID \
          --format="value(status.url)" 2>/dev/null || echo "")

        echo "Pre-deploy URLs (may be empty on first deploy):"
        echo "  WEB_URL    = $$WEB_URL"
        echo "  WORKER_URL = $$WORKER_URL"

        # Patch service.yaml with the resolved URLs
        python3 - << PYEOF
        import re, os

        web_url = os.environ.get("WEB_URL", "")
        worker_url = os.environ.get("WORKER_URL", "")

        for fname, app_url, worker_url_val in [
            ("service.yaml", web_url, worker_url),
            ("service-worker.yaml", worker_url, worker_url),
        ]:
            with open(fname) as f:
                text = f.read()
            if app_url:
                text = re.sub(
                    r'(- name: APP_URL\s+value:\s+)"[^"]*"',
                    lambda m, v=app_url: m.group(1) + f'"{v}"',
                    text, flags=re.MULTILINE,
                )
            if worker_url_val:
                text = re.sub(
                    r'(- name: WORKER_URL\s+value:\s+)"[^"]*"',
                    lambda m, v=worker_url_val: m.group(1) + f'"{v}"',
                    text, flags=re.MULTILINE,
                )
            with open(fname, "w") as f:
                f.write(text)
            print(f"[OK] {fname}: APP_URL={app_url!r}, WORKER_URL={worker_url_val!r}")
        PYEOF
    env:
      - 'WEB_URL=$(WEB_URL)'
      - 'WORKER_URL=$(WORKER_URL)'
    id: 'inject-urls'
    waitFor: ['prepare-yaml']

  # 7. Deploy web service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'replace'
      - 'service.yaml'
      - '--region=$_REGION'
    id: 'deploy-web'
    waitFor: ['inject-urls']

  # 8. Deploy worker service
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'services'
      - 'replace'
      - 'service-worker.yaml'
      - '--region=$_REGION'
    id: 'deploy-worker'
    waitFor: ['inject-urls']

  # 9. Post-deploy: patch APP_URL/WORKER_URL with the actual deployed URLs, then commit docs
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        source /workspace/build_env.sh
        set -e

        echo "=== Post-deploy URL patch + documentation sync ==="

        # Resolve the actual URLs now that services are deployed
        WEB_URL=$$(gcloud run services describe $_WEB_SERVICE \
          --region=$_REGION --project=$PROJECT_ID \
          --format="value(status.url)" 2>/dev/null || echo "")
        WORKER_URL=$$(gcloud run services describe $_WORKER_SERVICE \
          --region=$_REGION --project=$PROJECT_ID \
          --format="value(status.url)" 2>/dev/null || echo "")

        echo "  Deployed WEB_URL    = $$WEB_URL"
        echo "  Deployed WORKER_URL = $$WORKER_URL"

        # Patch the service YAMLs with the real URLs for the next deployment
        python3 - << PYEOF
        import re, os
        web_url = os.environ.get("WEB_URL_ACTUAL", "")
        worker_url = os.environ.get("WORKER_URL_ACTUAL", "")
        for fname, app_url, w_url in [
            ("service.yaml", web_url, worker_url),
            ("service-worker.yaml", worker_url, worker_url),
        ]:
            with open(fname) as f:
                text = f.read()
            if app_url:
                text = re.sub(r'(- name: APP_URL\s+value:\s+)"[^"]*"',
                    lambda m, v=app_url: m.group(1) + f'"{v}"', text, flags=re.MULTILINE)
            if w_url:
                text = re.sub(r'(- name: WORKER_URL\s+value:\s+)"[^"]*"',
                    lambda m, v=w_url: m.group(1) + f'"{v}"', text, flags=re.MULTILINE)
            with open(fname, "w") as f:
                f.write(text)
            print(f"[OK] {fname} patched with actual URLs.")
        PYEOF

        if [ ! -d .git ]; then
          echo "No .git directory found. Skipping repository documentation sync."
          exit 0
        fi

        # Configure git identity for the commit
        git config user.name  "cloud-build[bot]"
        git config user.email "cloud-build[bot]@users.noreply.github.com"

        # Run the doc updater to patch README badges + service YAMLs
        python3 scripts/update_docs.py --ci

        # Check if anything changed
        if git diff --quiet; then
          echo "No documentation changes to commit."
        else
          git add README.md gcp_deployment_guide.md service.yaml service-worker.yaml .test_count 2>/dev/null || true
          git commit -m "docs: set version $${RELEASE_VERSION} after successful Cloud Build [skip ci]"
          git push origin $_BRANCH_NAME 2>/dev/null || git push origin HEAD:current || echo "Push skipped (detached HEAD or no write access)"
        fi
    env:
      - 'WEB_URL_ACTUAL=$(WEB_URL)'
      - 'WORKER_URL_ACTUAL=$(WORKER_URL)'
    id: 'post-deploy'
    waitFor: ['deploy-web', 'deploy-worker']

substitutions:
  # ── Image & Repository ────────────────────────────────────────────────────────
  # Change _AR_REPO and _IMAGE together if you rename the Artifact Registry repo.
  _AR_REPO: 'aether-repo'
  _IMAGE: 'asia-southeast1-docker.pkg.dev/cs-poc-pfjoxqspipkzqdfmgnqcd3c/aether-repo/aether-web'

  # ── Deployment Targets ────────────────────────────────────────────────────────
  # Change _REGION once to deploy to a different GCP region.
  _REGION: 'asia-southeast1'
  _WEB_SERVICE: 'aether-web'
  _WORKER_SERVICE: 'aether-worker'

  # ── Git Branch ────────────────────────────────────────────────────────────────
  _BRANCH_NAME: 'current'
