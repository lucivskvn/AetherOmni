# ==============================================================================
# GCP CLOUD BUILD PIPELINE WITH KANIKO LAYER CACHING (REGION: asia-southeast1)
# ==============================================================================
steps:
  # 1. High-Performance Kaniko Container Build with Remote Layer Caching
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--destination=asia-southeast1-docker.pkg.dev/esbpcs-lab-un/cloud-run-source-deploy/:$COMMIT_SHA'
      - '--destination=asia-southeast1-docker.pkg.dev/esbpcs-lab-un/cloud-run-source-deploy/:latest'
      - '--cache=true'
      - '--cache-ttl=24h'
      - '--cache-dir=asia-southeast1-docker.pkg.dev/esbpcs-lab-un/cloud-run-source-deploy/cache'

  # 2. Serverless Cloud Run Deployment
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - ''
      - '--image=asia-southeast1-docker.pkg.dev/esbpcs-lab-un/cloud-run-source-deploy/:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'

substitutions:
  _SERVICE_NAME: 'aetheromni'

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: 'N1_HIGHCPU_8'
