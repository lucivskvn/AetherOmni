# ==============================================================================
# GCP CLOUD BUILD PIPELINE - FREE TIER & HIGH PERFORMANCE HARDEING
# ==============================================================================
# Free Tier Guarantees:
# - Cloud Run: 2M requests/mo, 360k GB-sec, 180k vCPU-sec FREE
# - Cloud Build: 120 build-mins/day FREE
# - Container CPU: Allocated ONLY during HTTP request processing
# ==============================================================================
steps:
  # 1. Kaniko Container Build with Remote Layer Caching
  - name: 'gcr.io/kaniko-project/executor:latest'
    args:
      - '--destination=asia-southeast1-docker.pkg.dev/esbpcs-lab-un/cloud-run-source-deploy/:$COMMIT_SHA'
      - '--destination=asia-southeast1-docker.pkg.dev/esbpcs-lab-un/cloud-run-source-deploy/:latest'
      - '--cache=true'
      - '--cache-ttl=24h'
      - '--cache-dir=asia-southeast1-docker.pkg.dev/esbpcs-lab-un/cloud-run-source-deploy/cache'

  # 2. Free-Tier Cost-Optimized Cloud Run Deployment
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - ''
      - '--image=asia-southeast1-docker.pkg.dev/esbpcs-lab-un/cloud-run-source-deploy/:$COMMIT_SHA'
      - '--region=asia-southeast1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--min-instances=0'
      - '--max-instances=5'
      - '--cpu=1'
      - '--memory=512Mi'
      - '--concurrency=80'
      - '--no-cpu-throttling'

substitutions:
  _SERVICE_NAME: 'aetheromni'

options:
  logging: CLOUD_LOGGING_ONLY
