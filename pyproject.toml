[project]
name = "aetheromni"
version = "1.5"
description = "Enterprise Multi-Model RAG & Document Intelligence Platform"
requires-python = ">=3.14"
readme = "README.md"
license = { text = "AGPL-3.0" }
dependencies = [
    "bleach>=6.4.0",
    "django-storages[google]>=1.14.6",
    "django>=6.0.8",
    "google-cloud-tasks>=2.24.0",
    "google-genai>=2.17.0",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "markdown>=3.10.3",
    "protobuf>=7.35.1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "ruff>=0.16.2",
    "sqlparse>=0.5.5",
    "surrealdb>=2.0.0",
    "whitenoise>=6.12.0",
    "sentry-sdk[django]>=2.22.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "coverage>=7.15.4",
]

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "static_root",
    "media",
    "db.sqlite3",
    "scratch"
]

line-length = 120
target-version = "py313"  # Preserves cross-version exception parenthesization (PEP 758 / py313+ compatibility)


[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90", "UP", "B", "S", "DJ", "RUF", "A", "ASYNC", "C4", "LOG", "G", "PIE", "PGH", "SIM", "PERF"]
ignore = [
    "S101", "S105", "S106", "E501", "S108", "S603", "E402", "F841", "S310", "B904",
    "S112", "B905", "W291", "W293", "RUF012", "DJ012", "S110", "S607", "RUF002",
    "DJ008", "F821", "SIM108", "SIM105", "PERF401", "A001", "A002", "A003", "G004", "S404", "S308"
]


[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
combine-as-imports = true
