[project]
name = "korda"
version = "1.5"
description = "KORDA — Knowledge Orchestration, Retrieval & Document Analysis Platform"
requires-python = ">=3.14"
readme = "README.md"
license = { text = "AGPL-3.0" }
dependencies = [
    "bleach>=6.4.0",
    "django-storages[google]>=1.14.6",
    "django>=6.0.8",
    "google-cloud-tasks>=2.24.0",
    "google-genai>=2.17.0",
    "gunicorn>=26.0.0",
    "httpx>=0.28.1",
    "markdown>=3.10.3",
    "protobuf>=7.35.1",
    "psycopg[binary]>=3.3.4",
    "python-dotenv>=1.2.2",
    "pyyaml>=6.0.3",
    "ruff>=0.16.2",
    "sqlparse>=0.5.5",
    "surrealdb>=2.0.0",
    "whitenoise>=6.12.0",
    "sentry-sdk[django]==2.22.0",
]

[project.optional-dependencies]
dev = [
    "mypy>=2.3.0",
    "bandit>=1.9.4",
    "pip-audit>=2.10.1",
    "coverage>=7.15.4",
]

[tool.ruff]
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "static_root",
    "media",
    "db.sqlite3",
    "scratch"
]

line-length = 120
target-version = "py313"  # Preserves cross-version exception parenthesization (PEP 758 / py313+ compatibility)


[tool.ruff.lint]
select = ["E", "F", "W", "I", "C90", "UP", "B", "S", "DJ", "RUF", "A", "ASYNC", "C4", "LOG", "G", "PIE", "PGH", "SIM", "PERF"]
ignore = [
    # S101: assert usage — acceptable in test/setup code; production code must not use asserts
    "S101",
    # E501: line length > 120 — enforced by formatter (line-length = 120); suppress linter duplicate
    "E501",
    # S108: probable insecure temporary file — /tmp usage in scripts is audited
    "S108",
    # S603: subprocess without shell=True — all subprocess calls are audited to use fixed args
    "S603",
    # E402: module level import not at top — Django settings ordering requires it
    "E402",
    # F841: local variable assigned but never used — acceptable for side-effect assignments
    "F841",
    # S310: URL open audit — all open() calls on URLs are audited
    "S310",
    # B904: raise without from in except — intentional in some handlers
    "B904",
    # S112: try/except/continue — audited
    "S112",
    # B905: zip() without strict — intentional in many zip usages
    "B905",
    # W291/W293: trailing whitespace — handled by formatter
    "W291", "W293",
    # RUF012: mutable class variable annotation — Django ORM fields are class-level
    "RUF012",
    # DJ012: model method ordering — style preference
    "DJ012",
    # S110: try/except/pass — audited
    "S110",
    # S607: subprocess start with partial path — audited
    "S607",
    # RUF002: ambiguous unicode — intentional in some docstrings
    "RUF002",
    # DJ008: model does not define __str__ — not required for all models
    "DJ008",
    # F821: undefined name — Django's dynamic attribute access
    "F821",
    # SIM108/SIM105: ternary/contextlib.suppress style — project prefers explicit
    "SIM108", "SIM105",
    # PERF401: manual list comprehension — readability over micro-optimization
    "PERF401",
    # A001/A002/A003: shadowing builtins — intentional in some Django view params
    "A001", "A002", "A003",
    # G004: f-string in logging — modern Python handles this efficiently
    "G004",
    # S404: subprocess import — audited
    "S404",
    # S308: mark_safe usage — audited; only used with pre-sanitized content
    "S308",
]

# S105/S106 (hardcoded passwords) are intentionally scoped to test files and dev setup scripts only.
# Production business logic is fully protected: a real credential in src would be flagged.
[tool.ruff.lint.per-file-ignores]
"extractor/tests/**" = ["S105", "S106", "S101"]
"extractor/tests.py" = ["S105", "S106", "S101"]
"core/settings.py" = ["S105", "S106"]
"scripts/init_surreal.py" = ["S105", "S106"]
"extractor/views.py" = ["S105"]  # S105 triggers on TEMPLATE_FORGOT_PASSWORD template path constant


[tool.ruff.lint.mccabe]
max-complexity = 15

[tool.ruff.lint.isort]
combine-as-imports = true

# ── Coverage configuration ────────────────────────────────────────────────────
# Branch coverage is intentionally disabled: it roughly doubles the per-line
# arc metadata stored in .coverage, significantly increasing RSS during
# instrumented runs on Python 3.14 / linuxbrew and causing swap pressure.
# Statement coverage is sufficient for the SonarCloud gate.
[tool.coverage.run]
include = [
    "core/*",
    "extractor/*.py",
    "extractor/templatetags/*",
]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/migrations/*",
    "scripts/*",
    "manage.py",
    "*/__pycache__/*",
]
branch = false

[tool.coverage.report]
skip_empty = true
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
