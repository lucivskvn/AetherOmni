---
# Docker Compose v2 format — the 'version' key is obsolete and intentionally
# omitted.
#
# Local development stack — mirrors production architecture.
# Production uses a remote SurrealDB instance configured via SURREAL_URL in .env
# Set SURREAL_URL in .env to point at the remote instance instead of the local
# container if you want to develop against production data.
services:
  # 1. Main Web Application (Gunicorn server)
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aether-web
    restart: always
    ports:
      - "8080:8080"
    env_file:
      - .env
    environment:
      - PORT=8080
      - SURREAL_URL=http://surrealdb:8000
    volumes:
      - ./db.sqlite3:/app/db.sqlite3
      - ./media:/app/media
    depends_on:
      surrealdb:
        condition: service_healthy

  # 2. SurrealDB v3 — Structured Data, Vector Store & KV Cache
  # Matches the remote production version
  surrealdb:
    image: surrealdb/surrealdb:v3.2.0
    container_name: aether-surrealdb
    security_opt:
      - no-new-privileges:true
    user: root
    restart: always
    ports:
      - "127.0.0.1:8001:8000"
    environment:
      - SURREAL_HTTP_MAX_SQL_BODY_SIZE=10485760
      - SURREAL_HTTP_MAX_API_BODY_SIZE=10485760
    command:
      - start
      - --log=info
      - --user=${SURREAL_USER:-root}
      - --pass=${SURREAL_PASS:?Set SURREAL_PASS in .env}
      - surrealkv://data/aetheromni.db
    volumes:
      - surreal_data:/data
    healthcheck:
      test:
        ["CMD", "/surreal", "is-ready", "--endpoint", "http://localhost:8000"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  surreal_data: {}
